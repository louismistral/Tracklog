  .log-subnav{display:flex;align-items:center;gap:22px;margin-bottom:26px;flex-wrap:nowrap}
  /* La hauteur n'est pas un nombre à tenir à jour : `align-self:stretch` la prend
     sur la ligne, dont la hauteur est celle du groupe Jour/Historique/Chrono. Le
     jour où ce groupe change de taille, le bouton suit sans qu'on y touche.
     Le label, lui, rétrécit en deux crans avant que quoi que ce soit passe à la ligne. */
  .subnav-add{white-space:nowrap;flex:0 0 auto;align-self:stretch;justify-content:center;
    padding:6px 14px;font-size:11px;text-transform:uppercase;letter-spacing:0.08em}
  .subnav-add .add-mid,.subnav-add .add-min{display:none}
  @media (max-width:620px){
    .log-subnav{gap:12px}
    .subnav-add .add-full{display:none} .subnav-add .add-mid{display:inline}
  }
  /* Dernier cran : réduit au seul « ＋ », le bouton n'est plus une pastille étirée
     mais un rond — un bouton qui ne porte qu'un signe n'a pas de mot à cadrer.
     La largeur vient du même jeton que la hauteur de la barre (--ctl-h), pas d'un
     `aspect-ratio` : une hauteur héritée d'un `stretch` n'est pas assez définie
     pour qu'un ratio en déduise la largeur, et le rond restait un rectangle. */
  @media (max-width:440px){ .log-subnav{gap:8px} }
  /* Le cran du rond seul descend à 355 px : la phrase qui occupait la droite de
     la barre est partie, et « ＋ Tracker » tient donc largement sur un téléphone
     courant. Un bouton qui garde son mot se vise mieux qu'un signe. */
  @media (max-width:355px){
    /* `height` en dur, pas seulement la largeur : `align-self:stretch` cale la
       hauteur sur la ligne, qui peut différer d'un pixel de --ctl-h selon la
       police réellement rendue — assez pour qu'un cercle cense devienne un
       ovale. Les deux dimensions doivent venir du même nombre pour qu'aucune
       des deux ne puisse diverger. */
    .subnav-add{padding:0;width:var(--ctl-h);height:var(--ctl-h);font-size:14px}
    .subnav-add .add-mid{display:none} .subnav-add .add-min{display:inline}
  }
  /* Last resort on the narrowest phones: tighten the sub-tabs themselves rather
     than let the row overflow the screen. */
  @media (max-width:390px){
    .log-subnav .seg-track.compact button{padding:6px 9px;letter-spacing:0.05em}
  }

  .trackers-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
  .trackers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .tk-card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;transition:border-color .5s var(--ease),transform .5s var(--ease)}
  .tk-card:hover{border-color:var(--line-2);transform:translateY(-2px)}
  .tk-info{min-width:0;flex:1;display:flex;flex-direction:column;gap:10px}
  .tk-name{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:500;min-width:0}
  .tk-name>span:not(.dot){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tk-name .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .tk-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .tk-type{font-size:9px;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-2);background:transparent;border:1px solid var(--line-2)}
  .tk-chip{font-size:10px;color:var(--ink-3);border:1px solid var(--line);text-transform:uppercase;letter-spacing:0.06em}
  .tk-count{font-size:11px;color:var(--ink-3);font-family:"Geist Mono",monospace}
  .tk-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  .tk-edit,.de-today{font-size:10px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:999px;padding:8px 14px;background:transparent;text-transform:uppercase;letter-spacing:0.12em;transition:all .35s var(--ease)}
  .tk-edit{flex-shrink:0}
  .tk-edit:hover,.de-today:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .tk-arch{font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:transparent;text-transform:uppercase;letter-spacing:0.12em;transition:all .35s var(--ease)}
  .tk-arch:hover{border-color:var(--ink-2);color:var(--ink)}
  .tk-card.archived{opacity:0.6}
  .tk-card.archived:hover{opacity:1}
  /* Master marker (diamond) */
  .master-mark{width:10px;height:10px;flex-shrink:0;transform:rotate(45deg);border-radius:2px}
  .master-tag{font-size:9px;text-transform:uppercase;letter-spacing:0.12em;color:var(--accent);border:1px solid var(--accent);margin-left:8px;flex-shrink:0;white-space:nowrap}

  /* ------------------------------------------------------------------
     Un nom long se coupe — il n'élargit jamais sa carte.
     Un tracker peut porter n'importe quel nom, et sans ces règles c'est
     la carte (ou la pastille, ou la ligne) qui s'étire pour le contenir,
     jusqu'à dépasser l'écran et faire défiler toute la page en travers.
     La règle est la même partout : le conteneur du nom accepte de
     rétrécir (min-width:0, sinon un élément flex refuse de passer sous
     sa taille de contenu), le nom se coupe en « … », et ce qui
     l'accompagne — badges, valeurs, boutons — ne rétrécit pas.
     ------------------------------------------------------------------ */
  /* La pièce maîtresse : une case de grille vaut par défaut `min-width:auto`,
     c'est-à-dire « au moins la largeur de mon contenu ». Une carte au nom long
     imposait donc sa largeur à sa colonne — 692 px dans 354 px d'écran — et
     `overflow-x:hidden` sur <html> masquait le débordement au lieu de le
     signaler : la carte était juste coupée, hors d'atteinte. Rendre les cases
     réductibles est ce qui laisse la troncature ci-dessous entrer en jeu. */
  .today-grid>*,.trackers-grid>*,.gridview>*,.chart-grid-layout>*{min-width:0}
  .ms-name{min-width:0}
  .lg-item{min-width:0}
  .lg-name{min-width:0;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .entry .name{min-width:0}
  .entry .name>span:not(.dot){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Pastilles du rail et sélecteur de membres : bornées, jamais plus larges
     que leur ligne, quel que soit le nom. */
  .pill{max-width:100%}
  .pill>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail .pill{max-width:min(100%,264px)}
  .member{max-width:min(100%,240px)}
  .member>span:not(.dot):not(.master-mark){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Coverage hint: an index built on some of its members, not all of them. */
  .ms-partial{font-size:9px;font-family:"Geist Mono",monospace;color:var(--ink-3);border:1px solid var(--line-2);margin-left:6px;white-space:nowrap}
  .chart-head .name .master-mark{margin-right:2px}

  /* History calendar + day editor */
  .cal{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:30px;max-width:440px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .cal-title{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;font-size:20px;text-transform:capitalize;letter-spacing:0}
  .cal-nav{font-size:17px;line-height:1;color:var(--ink-2);transition:all .35s var(--ease)}
  .cal-nav:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-dow{text-align:center;font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-3);padding-bottom:4px}
  .cal-cell{position:relative;aspect-ratio:1;border-radius:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink-2);border:1px solid transparent;font-feature-settings:"tnum";font-family:"Geist Mono",monospace;transition:background .3s var(--ease),color .3s var(--ease)}
  .cal-cell.blank{pointer-events:none}
  .cal-cell:not(.blank):hover{background:var(--bg-3);color:var(--ink)}
  .cal-cell.today{border-color:var(--line-2);color:var(--ink);font-weight:600}
  .cal-cell.sel{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .cal-dot{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent)}
  .cal-cell.sel .cal-dot{background:#fff}

  .day-editor-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .de-title{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;font-size:28px;color:var(--ink);text-transform:capitalize;line-height:1;letter-spacing:0}
  .de-sub{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.08em;font-family:"Geist Mono",monospace}
  /* Week number, next to a day's title — plain metadata, not a status, so it stays
     neutral rather than borrowing the accent the way a master's tag does.
     Géométrie partagée avec .today-progress : les deux étiquettes de la ligne du
     Log ont la même hauteur, quelle que soit la police de chacune. */
  .week-tag,.today-progress{display:inline-flex;align-items:center;background:transparent;
    font-size:11px;line-height:1.45;font-style:normal;text-transform:none;letter-spacing:0.02em;
    color:var(--ink-3);border:1px solid var(--line-2);border-radius:999px;padding:2px 9px}
  .week-tag{vertical-align:middle;margin-left:10px}
  .today-progress{font-family:"Geist Mono",monospace;color:var(--ink-2);letter-spacing:0.05em;padding:2px 12px}
  .de-today{margin-left:auto}
  .day-entries{margin-top:4px}

  /* ============================================================
     Food — page nutrition (app.food.jsx). Mêmes jetons de couleur
     que le reste, donc le mode clair suit sans une règle de plus.
     ============================================================ */
  .fd-datebar{display:flex;align-items:center;gap:14px;margin-bottom:20px}
  .fd-date{display:flex;flex-direction:column;gap:2px;min-width:0}
  .fd-date-main{font-family:"Instrument Serif",serif;font-style:italic;font-size:26px;color:var(--ink);text-transform:capitalize;line-height:1}
  .fd-date-sub{font-size:10px;color:var(--ink-3);letter-spacing:0.08em}
  .cal-nav:disabled{opacity:.3}

  /* Calories sur toute la largeur, les trois macros se partageant la ligne d'après. */
  .fd-totals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .fd-total{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:8px;transition:border-color .5s var(--ease)}
  .fd-total:hover{border-color:var(--line-2)}
  .fd-total.lead{grid-column:1 / -1}
  .fd-total-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:24px}
  .fd-total-label{font-size:10px;text-transform:uppercase;letter-spacing:0.14em;color:var(--ink-3)}
  .fd-total-v{font-family:"Geist Mono",monospace;font-size:22px;color:var(--ink);line-height:1;display:flex;align-items:baseline;gap:4px}
  .fd-total.lead .fd-total-v{font-size:28px}
  .fd-total-v .u{font-size:10px;color:var(--ink-3)}
  .fd-total-goal{font-size:10px;color:var(--ink-3);letter-spacing:0.06em}
  .fd-meter{display:block;height:3px;background:var(--bg-3);border-radius:2px;overflow:hidden}
  .fd-fill{display:block;height:100%;border-radius:2px;transition:width .6s var(--ease)}
  /* Dépassement calorique franc (au-delà de 2,5 % de la cible) : la jauge et le
     chiffre passent au rouge. Deux calories de trop ne sont pas un écart, c'est
     l'imprécision de l'estimation — d'où la tolérance plutôt qu'un simple « au
     dessus de l'objectif ». Rien de tel pour les macros : dépasser sa cible de
     protéines n'est pas une mauvaise nouvelle. */
  .fd-fill.over{background:var(--warn)!important}
  .fd-total.bad .fd-total-v,.today-card.bad .fd-card-v{color:var(--warn)}
  .fd-total.bad .fd-total-label,.today-card.bad .tc-name{color:var(--warn)!important}
  .fd-total.bad{border-color:color-mix(in srgb,var(--warn) 45%,transparent)}

  .fd-note{font-size:12px;color:var(--ink-2);margin:0 0 16px;line-height:1.6}
  .fd-note.warn{color:var(--warn)}
  .fd-link{background:none;border:none;padding:0;color:var(--accent);font-size:12px;text-decoration:underline;text-underline-offset:3px}
  .fd-link:hover{color:var(--ink)}

  .fd-scan-cta{margin-bottom:22px}
  .fd-primary{display:inline-flex;align-items:center;gap:9px;border:none;transition:all .35s var(--ease)}
  .fd-primary:hover{background:var(--accent-2)}

  /* Un repas est une carte : quatre sections rectangulaires plutôt que quatre
     titres qui coulent les uns dans les autres. La première ligne perd son
     filet — le bord de la carte le dit déjà. */
  .card.fd-card.fd-meal{margin-bottom:12px}
  .fd-meal-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
  .fd-meal .fd-row:first-of-type{border-top:none;padding-top:2px}
  .fd-meal-kcal{font-size:11px;color:var(--ink-3)}
  /* La ligne entière est le bouton « modifier » : un seul geste, et plus deux
     mots d'action répétés au bout de chaque ligne. La quantité est détachée du
     nom (sa propre colonne, à droite du groupe nom+marque) — collée dessus,
     elle se lisait comme la fin du nom. */
  .fd-row{display:flex;align-items:baseline;gap:14px;padding:11px 4px;border-top:1px solid var(--line);
    width:100%;text-align:left;background:none;color:inherit;font:inherit;border-left:none;border-right:none;
    border-bottom:none;cursor:pointer;transition:background .3s var(--ease)}
  .fd-row:hover{background:var(--bg-3)}
  .fd-row-main{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}
  .fd-row-name{font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .fd-row-brand{font-size:11px;color:var(--ink-3)}
  .fd-row-qty{font-size:11px;color:var(--ink-3);flex-shrink:0}
  .fd-row-macros{display:flex;gap:10px;font-size:11px;color:var(--ink-3);flex-shrink:0}
  .fd-row-macros i{font-style:normal;opacity:.6;margin-left:2px}
  .fd-row-kcal{font-family:"Geist Mono",monospace;font-size:13px;color:var(--ink);flex-shrink:0}
  .fd-row-kcal i{font-style:normal;font-size:9px;color:var(--ink-3);margin-left:3px}

  .fd-add{margin-top:8px;font-size:11px;color:var(--ink-3);background:none;border:1px dashed var(--line-2);border-radius:999px;padding:7px 14px;transition:all .35s var(--ease)}
  .fd-add:hover{color:var(--ink);border-color:var(--ink-3)}
  /* La même pastille pointillée, mais pleine largeur : « il y a une ligne de
     plus à écrire ici », dans l'éditeur de repas comme dans sa recette. */
  .fd-add.full{display:block;width:100%;text-align:center;padding:10px 14px}

  .fd-micros-block{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
  .fd-micros{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 22px;margin-top:14px}
  .fd-micro{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .fd-micro-label{font-size:12px;color:var(--ink-2)}
  .fd-micro-v{font-size:12px;color:var(--ink)}
  .fd-micro-rda{font-style:normal;font-size:10px;color:var(--ink-3);margin-left:6px}

  /* Scanner */
  .fd-scan-view{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/3;border:1px solid var(--line-2)}
  .fd-scan-view video{width:100%;height:100%;object-fit:cover;display:block}
  .fd-reticle{position:absolute;inset:16% 10%;pointer-events:none}
  .fd-reticle span{position:absolute;width:26px;height:26px;border:2px solid rgba(255,255,255,.85)}
  .fd-reticle span:nth-child(1){top:0;left:0;border-right:none;border-bottom:none}
  .fd-reticle span:nth-child(2){top:0;right:0;border-left:none;border-bottom:none}
  .fd-reticle span:nth-child(3){bottom:0;left:0;border-right:none;border-top:none}
  .fd-reticle span:nth-child(4){bottom:0;right:0;border-left:none;border-top:none}
  .fd-scan-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:12px;line-height:1.6;color:#efe9dd;background:rgba(0,0,0,.72)}
  .fd-scan-overlay.err{color:#ffb4a0}
  .fd-torch{position:absolute;left:10px;bottom:10px;font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 12px}
  .fd-torch.on{background:var(--accent);border-color:var(--accent)}
  /* Interrupteur caméra — en bas à droite du cadre, visible allumé comme éteint */
  /* Éteinte, la balise vidéo vide resterait un rectangle noir devant le fond */
  .fd-scan-view.off{background:var(--bg-3)}
  .fd-scan-view.off video{display:none}
  .fd-cam-toggle{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;
    font-size:10px;text-transform:uppercase;letter-spacing:0.1em;cursor:pointer;
    color:#fff;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:6px 12px;
    transition:background .3s var(--ease),border-color .3s var(--ease)}
  .fd-cam-toggle.on{background:var(--accent);border-color:var(--accent)}
  .fd-scan-view.off .fd-cam-toggle{color:var(--ink);background:var(--bg-2);border-color:var(--line-2)}
  .fd-scan-view.off .fd-cam-toggle:hover{border-color:var(--accent);color:var(--accent)}

  /* Les onglets de la modale d'ajout — une seule rangée : les quatre façons
     d'ajouter quelque chose à une journée. */
  .fd-tabs{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}

  /* Pastille d'origine d'un item — quatre origines, quatre teintes, et un
     contour plutôt qu'un aplat : c'est une étiquette de provenance, pas un
     état à défendre. Elle se lit sur une ligne de résultat comme sur une
     carte de bibliothèque, donc la taille est la même partout. */
  .item-tag{display:inline-block;flex-shrink:0;font-size:9px;line-height:1;padding:4px 8px;border-radius:999px;
    text-transform:uppercase;letter-spacing:0.12em;border:1px solid currentColor;
    background:transparent;white-space:nowrap;cursor:default}
  .item-tag.o-ref{color:oklch(0.62 0.10 150)}
  .item-tag.o-off{color:oklch(0.62 0.10 250)}
  .item-tag.o-ai{color:var(--accent)}
  .item-tag.o-custom{color:var(--ink-3)}
  .fd-item-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .fd-item-sub{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.1em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

  /* Étoile favori */
  .fd-fav:hover{color:var(--ink-2);border-color:var(--ink-3)}
  .fd-fav.on{color:var(--accent);border-color:var(--accent)}
  .fd-fav-btn.on{color:var(--accent);border-color:var(--accent)}

  /* Éditeur d'ingrédients — partagé par l'analyse IA et les repas enregistrés */
  .fd-ing-editor{margin:10px 0}
  .fd-ing{border-bottom:1px solid var(--line);padding:9px 0}
  .fd-ing-main{display:flex;align-items:center;gap:8px}
  .fd-ing-name{flex:1;min-width:0;font-size:13px;padding:5px 0;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fd-ing-qty{display:inline-flex;align-items:baseline;gap:2px;flex-shrink:0}
  .fd-ing-qty input{width:58px;text-align:right;font-family:"Geist Mono",monospace;font-size:13px;padding:5px 4px}
  .fd-ing-qty>i{font-size:10px;color:var(--ink-3);font-style:normal}
  .fd-ing-kcal{flex-shrink:0;font-size:13px;color:var(--ink);min-width:62px;text-align:right}
  .fd-ing-kcal>i{font-size:9px;color:var(--ink-3);font-style:normal;margin-left:2px}
  .fd-ing-btn{font-size:11px;line-height:1}
  .fd-ing-btn:hover{color:var(--ink);border-color:var(--ink-2)}
  .fd-ing-btn.del:hover{color:var(--warn);border-color:var(--warn)}
  .fd-ing-macros{display:flex;gap:14px;align-items:baseline;font-size:11px;color:var(--ink-3);margin-top:3px}
  .fd-ing-macros>span>i{font-size:9px;margin-left:2px;font-style:normal;opacity:.7}
  .fd-ing-note{font-style:italic;font-size:11px;color:var(--ink-3);margin-left:auto;text-align:right;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
  .fd-ing-picker{margin-top:12px}
  .fd-ing-total{display:flex;gap:16px;align-items:baseline;margin-top:12px;padding-top:10px;
    border-top:1px solid var(--line-2);font-size:13px}
  .fd-ing-total-l{flex:1;font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-3)}
  .fd-ing-total>span>i{font-size:9px;color:var(--ink-3);font-style:normal;margin-left:2px}

  /* Analyse IA — deux rectangles pleine largeur l'un sur l'autre : la photo,
     puis le texte. Ce sont deux façons de décrire la même assiette, pas deux
     champs d'un formulaire, d'où la même largeur et le même contour. */
  .fd-ai-input{display:flex;flex-direction:column;gap:10px}
  .fd-ai-drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    width:100%;min-height:120px;border:1px dashed var(--line-2);border-radius:var(--radius);
    background:var(--bg-3);color:var(--ink-3);cursor:pointer;overflow:hidden;
    transition:color .35s var(--ease),border-color .35s var(--ease)}
  .fd-ai-drop:hover{color:var(--accent);border-color:var(--accent)}
  .fd-ai-drop input[type=file]{display:none}
  .fd-ai-drop-plus{display:flex;align-items:center;justify-content:center;width:38px;height:38px;
    border-radius:50%;border:1px solid currentColor}
  .fd-ai-drop-label{font-size:10px;text-transform:uppercase;letter-spacing:0.12em}
  .fd-ai-drop.filled{min-height:0;border-style:solid;cursor:default;padding:0;aspect-ratio:16/10;background:#000}
  .fd-ai-drop.filled img{width:100%;height:100%;object-fit:contain;display:block}
  .fd-ai-text{width:100%;resize:vertical;min-height:88px;padding:12px 14px;
    border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-3);
    transition:border-color .35s var(--ease)}
  .fd-ai-text:focus{border-color:var(--line-2)}
  /* La bascule de profondeur au-dessus de la rangée d'action : elle se choisit
     AVANT de lancer, pas à côté du bouton qui lance. */
  /* `flex-wrap` : le cadre d'explication prend une ligne entière sous le
     contrôle, et sans repli il restait coincé sur la même ligne que la bascule,
     large de ce qu'il en restait. Même règle que toutes les rangées qui portent
     un « i ». */
  .fd-ai-mode{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:2px 0 10px}
  .fd-ai-actions{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-top:2px}
  .fd-ai-actions-end{justify-content:flex-end}
  .fd-ai-hint{font-size:12px;color:var(--ink-3);flex:1}
  .fd-ai-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:16px 0 4px}
  .fd-ai-plat{font-size:18px}
  .fd-ai-tags{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .fd-ai-marge{font-size:11px;color:var(--ink-3);text-align:right}
  .fd-ai-photo-del{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;border:none}
  .fd-ai-photo-del:hover{background:var(--warn)}

  /* Recette d'un repas — une simple liste d'étapes numérotées */
  /* Étapes de recette — le rond numéroté est à la fois le rang, la case à
     cocher et la poignée de glisser ; le texte s'enroule sur autant de lignes
     qu'il en faut (hauteur pilotée en JS, voir autoGrowStep). */
  .fd-steps{display:flex;flex-direction:column;gap:8px}
  .fd-step{display:flex;align-items:flex-start;gap:10px}
  .fd-step-n{font-family:"Geist Mono",monospace;font-size:11px;color:var(--ink-2);
    touch-action:pan-y;margin-top:1px}
  .fd-step-n:hover{color:var(--accent);border-color:var(--accent)}
  .fd-step-n.on{color:#fff;background:var(--accent);border-color:var(--accent)}
  .fd-step-txt{flex:1;min-width:0;font-size:13px;line-height:1.5;resize:none;overflow:hidden;
    padding:5px 0;border:none;border-bottom:1px solid transparent;background:none}
  .fd-step-txt:focus{border-bottom-color:var(--line-2);outline:none}
  /* Cochée, l'étape s'efface sans disparaître : elle reste lisible, elle ne
     réclame juste plus l'attention. */
  .fd-step.done .fd-step-txt{color:var(--ink-3)}
  .fd-step .fd-ing-btn{margin-top:3px}
  /* Le minuteur d'une étape : une pastille de la hauteur du bouton d'à côté,
     qui porte la durée au repos et le décompte quand ça tourne. */
  .fd-step-timer{display:inline-flex;align-items:center;gap:3px;flex-shrink:0;height:26px;margin-top:3px;
    padding:0 9px;border:1px solid var(--line);border-radius:999px;color:var(--ink-3);
    font-size:11px;transition:color .3s var(--ease),border-color .3s var(--ease)}
  .fd-step-timer:focus-within{border-color:var(--line-2);color:var(--ink-2)}
  .fd-step-timer input{width:26px;text-align:right;font-size:11px;font-family:"Geist Mono",monospace;padding:0}
  .fd-step-timer input::-webkit-outer-spin-button,
  .fd-step-timer input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .fd-step-timer input[type=number]{-moz-appearance:textfield}
  .fd-step-timer>i{font-style:normal;font-size:9px;letter-spacing:0.06em}
  .fd-step-timer.running{color:var(--accent);border-color:var(--accent);font-size:12px;padding:0 11px}
  /* Le rond bat pendant le décompte : de loin, on voit lequel tourne. */
  .fd-step-n.ticking{color:var(--accent);border-color:var(--accent);animation:tickPulse 1s ease-in-out infinite}
  @keyframes tickPulse{0%,100%{opacity:1}50%{opacity:.55}}
  .fd-scan-hint{font-size:12px;color:var(--ink-3);margin:10px 0 0;line-height:1.6}

  /* Recherche et listes de résultats */
  .fd-search-bar{margin-bottom:12px}
  /* Le scanner, sorti par le bouton rond de la barre — un panneau qui s'ouvre
     sous elle, pas un onglet à lui. */
  .fd-scan-panel{margin-bottom:14px}
  /* « Mes items » : la bascule et l'étoile occupent la barre, le filtre se
     range en dessous, discret — il sert quand la liste est longue, pas avant. */
  .fd-mine-bar{margin:12px 0 4px}
  .fd-mine-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 4px}
  /* Plus de cadre dans le cadre : la page d'ajout défile déjà, une liste qui
     défilait dans sa propre fenêtre de 46vh n'utilisait qu'un tiers de l'écran
     pour montrer ce qu'on est venu chercher. */
  .fd-list{display:flex;flex-direction:column;gap:8px;margin:10px 0 0}
  /* La carte d'un item : trois zones dans une grille, pour que les mêmes
     éléments tombent au même endroit d'une carte à l'autre.
       nom  | chiffres
       tag+actions | chiffres
     avec, à gauche, une colonne d'image quand on l'a demandée. */
  .fd-item-row{display:grid;grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:"name nums" "foot nums";
    column-gap:10px;row-gap:5px;align-items:center;padding:9px 10px;
    background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);
    transition:border-color .35s var(--ease)}
  .fd-item-row.with-img{grid-template-columns:auto minmax(0,1fr) auto;
    grid-template-areas:"img name nums" "img foot nums"}
  .fd-item-row:hover{border-color:var(--line-2)}
  .fd-item-thumb{grid-area:img;width:42px;height:42px;flex-shrink:0}
  .fd-item-thumb img{width:100%;height:100%;object-fit:cover;border-radius:2px;background:var(--bg-3)}
  .fd-item-ph{width:100%;height:100%;border-radius:2px;background:var(--bg-3);display:flex;
    align-items:center;justify-content:center;font-family:"Instrument Serif",serif;font-style:italic;color:var(--ink-3)}
  /* Le nom et sa sous-catégorie se posent l'un sous l'autre plutôt que de se
     tronquer tous les deux quand la carte porte aussi une image. */
  .fd-item-name{grid-area:name;display:flex;flex-wrap:wrap;align-items:baseline;gap:1px 7px;min-width:0;
    width:100%;text-align:left;padding:0;border:none;background:none;color:inherit;font:inherit}
  .fd-item-name .n{font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fd-item-sub{font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-3);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:1;min-width:0}
  /* La pastille d'origine a la largeur du plus long des quatre mots (« simple »),
     quel que soit le sien : c'est ce qui met les trois ronds qui la suivent à la
     même abscisse sur toutes les cartes. */
  .fd-item-foot{grid-area:foot;display:flex;align-items:center;gap:4px;min-width:0}
  /* 56 px : la largeur du plus long des quatre mots (« simple »), pas une
     valeur ronde choisie au hasard. En dessous, la pastille reprend sa largeur
     naturelle et les trois ronds se décalent d'une carte à l'autre. */
  .fd-item-foot .item-tag{min-width:56px;text-align:center;flex-shrink:0;padding:4px 6px}
  /* Aligné sur la ligne du TITRE, pas centré entre les deux lignes : les
     chiffres et le nom se lisent d'un même regard, et la barre tombe alors
     naturellement au niveau de la rangée des actions. */
  /* `align-self:baseline` retombe à `start` pour un item qui enjambe deux
     lignes de la grille (hors spec pour les items multi-rangées) : mesuré, ça
     ne change rien. Le décalage vertical est donc posé à la main, pour que la
     première ligne des chiffres (12.5px) tombe sur la même assise visuelle que
     le titre (13px) — les deux tailles de police n'ont pas le même vide sous
     la ligne de base, `align-self:start` seul les cale par le haut de leur
     boîte, pas par leur texte. */
  .fd-item-nums{grid-area:nums;padding:0;border:none;background:none;color:inherit;font:inherit;
    display:block;flex-shrink:0;align-self:start;margin-top:3px}

  /* Les chiffres : une ligne, et des COLONNES de largeur fixe. Ce ne sont pas
     les valeurs qui décident de la largeur — les chiffres sont tabulaires et
     chaque colonne a la sienne — donc « 63 » et « 1000 » occupent exactement la
     même place, les colonnes tombent au même endroit d'une carte à l'autre, et
     la barre de composition mesure partout la même chose : comparer deux barres
     redevient légitime. Aucun trait dessiné : c'est l'alignement qui fait le
     tableau. */
  /* Largeur FIXE, pas « au contenu » : la légende des calories change de
     longueur selon l'aliment (kcal/100g, kcal/100ml, kcal/part) et le bloc
     changeait de taille d'une carte à l'autre. Fixé, il ne bouge plus et la
     barre mesure partout la même chose. */
  .fd-macros{display:flex;flex-direction:column;gap:5px;flex:none;width:172px}
  .comp{display:flex;height:3px;overflow:hidden;background:var(--bg-3)}
  .comp i{display:block;height:100%}
  .fd-macro-row{display:flex;align-items:baseline;gap:6px}
  /* Les calories calées à gauche du bloc, les trois macros en colonnes fixes à
     droite. La lettre est sur la même ligne que son chiffre, pas dessous. */
  .mc{display:flex;align-items:baseline;gap:2px;justify-content:flex-end;
    width:27px;flex:none;color:var(--ink-2)}
  /* Deux classes, pas une : la règle étroite plus bas repose la largeur des
     colonnes de macro, et à spécificité égale c'est la dernière écrite qui
     gagne — la colonne des calories se retrouvait large de 28 px avec son
     unité qui débordait sur les protéines. */
  .fd-macro-row .mc-kcal{width:auto;flex:1 1 auto;min-width:0;justify-content:flex-start;color:var(--ink)}
  .mc b{font-family:"Geist Mono",monospace;font-feature-settings:"tnum";font-size:11px;
    font-weight:400;color:currentColor;line-height:1.2;text-align:right}
  .mc-kcal b{font-size:12.5px;min-width:3.2ch;text-align:left}
  .mc u{font-size:7px;letter-spacing:0.02em;text-transform:uppercase;text-decoration:none;
    color:var(--ink-3);line-height:1;white-space:nowrap}
  .mc-kcal u{letter-spacing:0.04em}
  /* Sur un écran étroit tout le bloc se resserre — pour toutes les cartes à la
     fois, donc les colonnes restent alignées entre elles. */
  @media (max-width:390px){
    .fd-macros{width:158px}
    .mc{width:24px}
    .mc u{font-size:6.5px;letter-spacing:0}
    .fd-macro-row{gap:4px}
    .fd-item-foot{gap:3px}
    .fd-item-foot .item-tag{min-width:54px}
  }
  .fd-edit-btn:hover{color:var(--accent);border-color:var(--accent)}
  .fd-forget-btn:hover{color:var(--warn);border-color:var(--warn)}
  .fd-edit-btn:hover{color:var(--accent);border-color:var(--accent)}
  .fd-forget-btn:hover{color:var(--warn);border-color:var(--warn)}
  .fd-list-label{font-size:10px;text-transform:uppercase;letter-spacing:0.14em;color:var(--ink-3);margin:10px 0 2px;padding:0 4px}
  /* Le décompte de résultats occupe la barre à icône de l'onglet Recherche
     exactement comme la bascule Aliments/Repas occupe celle de Mes items :
     une saisie nue reçoit le contour de la barre, un texte nu ne le reçoit
     pas — il n'y a rien à y saisir. */
  .fd-bar-note{font-size:12px;color:var(--ink-3);min-height:18px;display:flex;align-items:center}
  .fd-src-line{margin-top:12px}
  .fd-src-line a,.fd-src-link{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line-2);transition:color .3s var(--ease)}
  .fd-src-line a:hover,.fd-src-link:hover{color:var(--accent);border-color:var(--accent)}
  a.tk-edit.fd-src-link{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:10px;text-transform:uppercase;letter-spacing:0.1em;display:inline-block}

  /* Le bloc Sources, en bas de la page Food */
  /* Le crédit reste écrit (la licence le demande) ; ce qui l'explique tient
     dans sa bulle. La bulle est ancrée à gauche ici : posée à droite, elle
     sortait de l'écran sur les crédits qui commencent près du bord. */
  .fd-sources{position:relative;margin:44px 0 8px;padding-top:18px;border-top:1px solid var(--line);
              display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px}
  .fd-src-credit{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
  .fd-src-lic{font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-3);
              border:1px solid var(--line-2);border-radius:999px;padding:2px 7px}
  /* Le crédit passe à la ligne pour accueillir son cadre d'explication, comme
     partout ailleurs : l'explication vit sous ce qu'elle explique. */
  .fd-src-credit{flex-wrap:wrap}
  .fd-sources a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line-2)}
  .fd-sources a:hover{color:var(--accent);border-color:var(--accent)}
  .fd-source-links{display:flex;flex-direction:column;gap:8px;font-size:10px;text-transform:uppercase;letter-spacing:0.1em}
  .fd-source-links a{border-bottom:none;color:var(--ink-3)}

  /* Scanner : zoom, photo de secours, diagnostic */
  .fd-zoom{display:flex;align-items:center;gap:12px;margin-top:12px}
  .fd-zoom label{font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-3)}
  .fd-zoom input[type=range]{flex:1;accent-color:var(--accent)}
  .fd-scan-diag{color:var(--ink-3);opacity:.65;font-size:10px;white-space:nowrap}

  /* Ajout rapide — chaque question dans son propre cadre : la même carte que
     partout ailleurs (`.card`), resserrée pour tenir plusieurs à la suite
     plutôt qu'une seule pleine largeur. `:last-of-type` retire déjà la
     bordure du dernier `.field` de chaque carte — nul besoin de la remettre
     à la main comme quand les sections n'étaient que des filets à la suite. */
  /* La piste des sous-modes tient à ses options : dans une colonne flex elle
     s'étirait sur toute la largeur, laissant un vide à droite des trois
     boutons — un contour qui promettait une option de plus. */
  .fd-manual-entry .fd-tabs{align-items:flex-start}
  .card.fd-card{padding:16px 18px;margin-bottom:14px}
  .card.fd-card .section-label{margin-bottom:12px}
  .fd-card-note{margin-top:10px;margin-bottom:0}
  .fd-title-field{border-bottom:none;padding-top:0}
  .fd-title-field input{font-size:16px}
  .fd-code-bar{margin:2px 0 10px}
  .fd-code-bar input{font-family:"Geist Mono",monospace;letter-spacing:0.06em}
  .fd-qty-inline{display:flex;align-items:center;gap:10px;flex:1;flex-wrap:wrap}
  .fd-qty-inline input{width:84px;font-family:"Geist Mono",monospace;text-align:right}
  /* Le corps d'un `NumField` : l'input prend la place, l'unité colle à sa
     droite — la même rangée dense que tout `.field`, jamais un pavé à part
     pour les macros. */
  .field-num{display:flex;align-items:baseline;flex:1}
  .field-num input{width:100%}

  /* Une portion, sous le total de la recette : la même rangée que le total,
     juste plus discrète — c'est une lecture dérivée, pas un second total. */
  .fd-per-portion{border-top-color:var(--line);color:var(--ink-2)}
  .fd-per-portion .fd-ing-total-l{color:var(--ink-3)}

  /* Quantité */
  .fd-qty-unit{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.1em}
  .fd-qty{display:flex;align-items:center;gap:10px;margin:6px 0 16px;flex-wrap:wrap}
  .fd-qty input{width:120px;font-size:20px;font-family:"Geist Mono",monospace;text-align:right}
  .fd-qty input::placeholder{font-family:"Geist",ui-sans-serif,sans-serif;font-size:13px}
  /* La bascule d'unité (g / portion) est un Segmented par défaut — ses chips
     dans une modale de choix (18px de haut en plus) sont pensées pour porter
     un mot seules sur leur ligne, pas pour voisiner un champ et des raccourcis.
     Resserrée ici à une taille qui n'est ni la sienne ni celle des raccourcis
     d'origine, mais entre les deux — c'est elle que les raccourcis reprennent
     juste en dessous, pour que toute la rangée parle le même gabarit. */
  .fd-qty .seg-track button{padding:6px 11px;font-size:11px}
  /* Les raccourcis de quantité : sur la même ligne que le champ et son unité,
     après eux. Une seule ligne, jamais deux — c'est pour ça qu'il y en a quatre
     au maximum. */
  .fd-presets{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
  .fd-preset{display:inline-flex;align-items:center;border:1px solid var(--line);
    border-radius:999px;overflow:hidden;transition:border-color .3s var(--ease)}
  .fd-preset:hover{border-color:var(--line-2)}
  .fd-preset>button{font-family:"Geist Mono",monospace;font-size:11px;color:var(--ink-2);
    background:none;border:none;padding:6px 4px 6px 11px;cursor:pointer}
  .fd-preset>button:hover{color:var(--ink)}
  .fd-preset-x{font-size:8px;color:var(--ink-3);background:none;border:none;padding:6px 9px 6px 3px;cursor:pointer}
  .fd-preset-x:hover{color:var(--warn)}
  .fd-preset-add{font-size:13px;line-height:1;color:var(--ink-3);border:1px dashed var(--line-2);
    border-radius:999px;width:27px;height:27px;background:none;cursor:pointer;flex-shrink:0;
    transition:color .3s var(--ease),border-color .3s var(--ease)}
  .fd-preset-add:hover{color:var(--accent);border-color:var(--accent);border-style:solid}
  .fd-preset-all{font-size:11px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;
    padding:6px 11px;background:transparent;white-space:nowrap;transition:all .35s var(--ease)}
  .fd-preset-all:hover{border-color:var(--line-2);color:var(--ink)}
  /* Les mêmes cases que sur une carte d'item, en plus grand : c'est le même
     objet — quatre chiffres qui vont ensemble — vu de plus près. */
  .fd-preview{padding:14px 0 16px}
  .fd-macros-wide{width:100%}
  .fd-macros-wide .mc{width:64px}
  .fd-macros-wide .mc-kcal{width:auto}
  .fd-macros-wide .mc b{font-size:19px}
  .fd-macros-wide .mc-kcal b{font-size:21px}
  .fd-macros-wide .mc u{font-size:9px}
  .fd-modal .modal-section{margin-top:18px}
  .fd-more-fields{margin-top:6px}

  /* Bibliothèque */
  .fd-lib-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .fd-lib-search{max-width:180px}
  .fd-food-card{flex-direction:column;align-items:stretch}
  .fd-food-nums{font-size:11px;color:var(--ink-2);margin-top:8px}
  .fd-per{color:var(--ink-3)}
  /* Les actions d'un aliment tiennent sur une ligne (elles passent à la suivante
     si la carte est vraiment étroite), et la source se réduit à sa flèche. */
  /* Colonnes plus larges que la grille de trackers : une carte d'aliment porte
     quatre actions sur une ligne, il lui faut la place de les tenir. */
  .fd-foods-grid{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
  .fd-food-actions{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}
  .fd-food-actions .tk-edit{padding:7px 10px;letter-spacing:0.08em}
  .tk-edit.danger-edit:hover{background:var(--warn);border-color:var(--warn);color:var(--bg)}
  /* Plus de `margin-left:auto` : la flèche vivait seule au bout de la ligne,
     elle est maintenant la première des trois actions groupées, et il n'y a
     plus rien à repousser. */
  .fd-src-btn{text-decoration:none}
  .fd-src-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

  /* Répartition des calories */
  .fd-split{display:flex;height:12px;border-radius:2px;overflow:hidden;margin:6px 0 14px;background:var(--bg-3)}
  .fd-split-part{display:block;height:100%}

  /* Les 4 compteurs dans la page Log */
  .fd-log-group{margin-top:34px;padding-top:26px;border-top:1px solid var(--line)}
  .fd-log-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
  .fd-log-title{display:flex;align-items:baseline;gap:8px}
  .fd-log-title .drag-handle{align-self:center}
  .today-card.fd-card{cursor:pointer;gap:10px}
  .today-card.fd-card:hover{border-color:var(--line-2)}
  .fd-card-v{font-family:"Geist Mono",monospace;font-size:24px;color:var(--ink);line-height:1;display:flex;align-items:baseline;gap:4px}
  .fd-card-v .u{font-size:10px;color:var(--ink-3)}
  .fd-card-goal{font-size:10px;color:var(--ink-3);letter-spacing:0.06em}

  hr.thin{border:none;border-top:1px solid var(--line);margin:22px 0}

  .footer-note{margin-top:34px;font-size:10px;color:var(--ink-3);text-align:center;text-transform:uppercase;letter-spacing:0.16em}

  /* Custom cursor (desktop / fine-pointer only; enabled by JS) */
  .cursor-dot,.cursor-ring{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;border-radius:50%;mix-blend-mode:difference;will-change:transform}
  .cursor-dot{width:6px;height:6px;background:#fff;margin:-3px 0 0 -3px}
  .cursor-ring{width:32px;height:32px;border:1px solid rgba(255,255,255,.55);margin:-16px 0 0 -16px;transition:width .35s var(--ease),height .35s var(--ease),margin .35s var(--ease),border-color .35s var(--ease)}
  .has-cursor,.has-cursor *{cursor:none!important}
  .cursor-hot .cursor-ring{width:54px;height:54px;margin:-27px 0 0 -27px;border-color:var(--accent)}
  .cursor-down .cursor-ring{width:24px;height:24px;margin:-12px 0 0 -12px}

  /* ============================================================
     Mobile — used as a webapp on phones: no pinch/double-tap zoom
     (see viewport meta + touch-action above), inputs kept at 16px
     to stop iOS auto-zoom-on-focus, and layouts that could overflow
     the viewport width are forced to stack/wrap instead.
     ============================================================ */
  @media (max-width: 640px){
    .app{padding:22px 18px 80px}

    /* Inputs must stay >=16px or iOS Safari zooms in on focus */
    input,select,textarea,
    .field input,.field select,.field textarea,
    .tc-input input,.tc-input textarea{font-size:16px}

    /* Header: stack brand / tabs / account actions instead of one row */
    .topbar{flex-direction:column;align-items:stretch;gap:16px;margin-bottom:14px}
    .brand .by{display:none}
    .topbar-actions{flex-wrap:wrap;justify-content:space-between;gap:14px 20px}
    .tabs{flex:1 1 100%;order:1;gap:22px}
    .tabs button{flex:0 0 auto;text-align:center;padding:2px 0}

    /* Rows of controls that could overflow narrow screens */
    .vue-controls{flex-wrap:wrap;gap:12px 16px}
    .layout-bar{flex-wrap:wrap;gap:10px 16px}
    .chart-head{flex-direction:column;align-items:flex-start;gap:8px}
    .chart-head .stats{flex-wrap:wrap;gap:6px 16px}
    .trackers-head{flex-wrap:wrap;gap:12px}

    /* Fixed min-widths that force horizontal overflow on narrow screens.
       Le sélecteur d'attribut est nécessaire : `.chart-grid-layout` seul est
       moins spécifique que `.chart-grid-layout[data-per="3"]` et se ferait
       battre quel que soit l'ordre des règles. */
    .chart-grid-layout,.chart-grid-layout[data-per]{grid-template-columns:1fr}
    .today-grid{grid-template-columns:1fr}
    .trackers-grid{grid-template-columns:1fr}
    .gridview{grid-template-columns:repeat(2,1fr)}

    /* Entry rows: tighten spacing, always show actions (no hover on touch) */
    .entry{grid-template-columns:70px 1fr auto;gap:12px}
    .entry:hover{padding-left:6px}
    .entry .actions{opacity:1}
    .entry .actions button{padding:6px 8px;font-size:11px}

    /* Quick-add / tracker form fields: narrower label frees up room for the input */
    .field label{width:66px}

    .modal{padding:22px}
    .fd-add-head{padding:16px 16px 0}
    .fd-add-page .fd-add-tabs{padding:0 16px 14px}
    .fd-add-body{padding:14px 16px 32px}
    .typegrid{grid-template-columns:repeat(2,1fr)}

    /* Food : les trois macros restent sur une ligne (c'est la lecture qu'on
       vient chercher), en resserrant plutôt qu'en repliant ; les lignes de
       repas gardent leurs actions visibles (pas de survol au doigt). */
    .fd-totals{gap:8px}
    .fd-total{padding:13px 12px;gap:7px}
    .fd-total-v{font-size:17px}
    .fd-total.lead{padding:16px 18px}
    .fd-total.lead .fd-total-v{font-size:24px}
    .fd-total-label{letter-spacing:0.08em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .fd-total-goal{font-size:9px}
    /* Une entrée du jour reste sur UNE ligne : c'est le nom qui se coupe si la
       place manque, pas la ligne qui se scinde en deux. */
    .fd-row{gap:8px}
    .fd-row-macros{gap:7px}
    .fd-micros{grid-template-columns:1fr}
    .fd-lib-search{max-width:none;flex:1 1 100%;order:-1}
    .fd-macros-wide .mc{width:52px}
    .fd-macros-wide .mc b{font-size:17px}
    .fd-primary{width:100%;justify-content:center}
    /* Barre à icône : la forme intégrée reste une barre (le rond doit tenir
       dedans), la forme séparée passe à la ligne plutôt que d'écraser sa
       bascule — l'étoile ne perd rien à être en dessous. */
    .icon-bar.detached{gap:8px;flex-wrap:nowrap}
    .icon-bar.detached>.icon-bar-field{min-width:0}
    .fd-ai-drop{min-height:100px}
  }
</style>
</head>
<body>
<div id="root"><div class="boot-fallback" id="boot-fallback"><span class="em-serif">Chargement…</span><p id="boot-msg"></p></div></div>

<!-- Boot watchdog: the app depends on React/Babel/Supabase loading live from
     CDNs (see script tags below) and on app.jsx running without throwing.
     If any of that fails — CDN blocked/down, offline, ad-blocker — React
     never mounts and #root would otherwise stay on its initial "Chargement…"
     forever with no clue why. This catches load failures and any uncaught
     error/rejection during boot and swaps in a plain-language message with
     a retry button, so the screen is never just the background gradient. -->
<script>
(function(){
  var done = false; // set true once app.jsx has actually mounted React
  window.__tkBootDone = function(){ done = true; };
  function show(msg){
    if (done) return;
    var el = document.getElementById('boot-msg');
    if (el) el.innerHTML = msg + '<br><button onclick="location.reload()" style="margin-top:14px;background:var(--accent);color:#fff;padding:9px 18px;border-radius:999px;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase">Réessayer</button>';
  }
  window.addEventListener('error', function(e){
    show('Un script n’a pas pu se charger ou a échoué (' + (e.message || (e.target && e.target.src) || 'erreur inconnue') + '). Vérifie ta connexion ou désactive un éventuel bloqueur de scripts, puis réessaie.');
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    show('Une erreur est survenue au chargement (' + (e.reason && e.reason.message || e.reason) + '). Réessaie.');
  });
  setTimeout(function(){
    if (!done) show('Le chargement prend trop de temps — probablement une ressource externe (CDN) inaccessible depuis ce réseau. Vérifie ta connexion, puis réessaie.');
  }, 12000);
})();
</script>

<!-- Desktop custom cursor: a lagging dot + ring that grows over interactive
     elements. Lives on <body> outside React's #root and only uses global
     listeners, so React re-renders never disturb it. Disabled on touch /
     coarse-pointer devices (phones), where the native experience is kept. -->
<script>
(function(){
  if(!window.matchMedia || !matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  var dot=document.createElement('div'); dot.className='cursor-dot';
  var ring=document.createElement('div'); ring.className='cursor-ring';
  document.body.appendChild(dot); document.body.appendChild(ring);
  document.documentElement.classList.add('has-cursor');
  var mx=innerWidth/2, my=innerHeight/2, dx=mx, dy=my, rx=mx, ry=my;
  addEventListener('mousemove',function(e){ mx=e.clientX; my=e.clientY; },{passive:true});
  (function loop(){
    dx+=(mx-dx)*0.4; dy+=(my-dy)*0.4;
    rx+=(mx-rx)*0.16; ry+=(my-ry)*0.16;
    dot.style.transform='translate('+dx+'px,'+dy+'px)';
    ring.style.transform='translate('+rx+'px,'+ry+'px)';
    requestAnimationFrame(loop);
  })();
  var hot='a,button,input,textarea,select,.pill,.cal-cell:not(.blank),.tk-card,.gv-card,.today-card,.swatches button,.swatch';
  var root=document.documentElement;
  document.addEventListener('mouseover',function(e){ if(e.target.closest && e.target.closest(hot)) root.classList.add('cursor-hot'); });
  document.addEventListener('mouseout',function(e){ if(e.target.closest && e.target.closest(hot)) root.classList.remove('cursor-hot'); });
  addEventListener('mousedown',function(){ root.classList.add('cursor-down'); });
  addEventListener('mouseup',function(){ root.classList.remove('cursor-down'); });
})();
</script>
