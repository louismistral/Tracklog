<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Tracklog</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f6f4ef;
    --bg-2: #efece4;
    --ink: #1c1b18;
    --ink-2: #46443e;
    --ink-3: #8a877e;
    --line: #e3dfd5;
    --line-2: #d3cec1;
    --accent: oklch(0.55 0.10 150);
    --accent-soft: oklch(0.92 0.04 150);
    --warn: oklch(0.65 0.12 50);
    --radius: 10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"Geist",ui-sans-serif,system-ui,sans-serif;font-feature-settings:"ss01","cv11";-webkit-font-smoothing:antialiased}
  body{min-height:100vh}
  .mono{font-family:"Geist Mono",ui-monospace,monospace;font-feature-settings:"tnum"}
  .serif{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
  input,select,textarea{font-family:inherit;font-size:14px;color:inherit;background:transparent;border:none;outline:none}
  input::placeholder,textarea::placeholder{color:var(--ink-3)}

  /* Layout */
  .app{max-width:1080px;margin:0 auto;padding:28px 28px 80px}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;gap:24px;margin-bottom:36px}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand .mark{width:10px;height:10px;background:var(--ink);border-radius:2px;transform:translateY(1px)}
  .brand h1{font-size:18px;font-weight:500;letter-spacing:-0.01em;margin:0}
  .brand .by{font-size:13px;color:var(--ink-3)}
  .tabs{display:flex;gap:2px;background:var(--bg-2);padding:3px;border-radius:8px;border:1px solid var(--line)}
  .tabs button{padding:6px 14px;border-radius:6px;font-size:13px;color:var(--ink-2);font-weight:500;letter-spacing:-0.005em}
  .tabs button.active{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px var(--line)}

  /* Tracker rail */
  .rail{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:24px}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border-radius:999px;font-size:13px;background:var(--bg);border:1px solid var(--line);color:var(--ink-2);transition:all .12s}
  .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .pill:hover{border-color:var(--line-2)}
  .pill.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .pill.active .dot{outline:2px solid rgba(255,255,255,.18)}
  .pill.add{color:var(--ink-3);border-style:dashed;background:transparent}
  .pill.add:hover{color:var(--ink);border-color:var(--ink-2)}

  /* Log layout */
  .grid2{display:grid;grid-template-columns:1fr 320px;gap:32px;align-items:start}
  @media(max-width:840px){.grid2{grid-template-columns:1fr}}

  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-3);margin:0 0 14px;font-weight:500}

  /* Quick add card */
  .card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .qa{position:relative}
  .qa h3{margin:0 0 4px;font-size:15px;font-weight:500}
  .qa .sub{font-size:13px;color:var(--ink-3);margin-bottom:14px}
  .field{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
  .field:last-of-type{border-bottom:none}
  .field label{font-size:12px;color:var(--ink-3);width:78px;flex-shrink:0;text-transform:uppercase;letter-spacing:0.08em}
  .field input,.field select,.field textarea{flex:1;font-size:14px}
  .field .unit{color:var(--ink-3);font-size:13px;margin-left:6px}
  .field textarea{resize:none;min-height:20px;line-height:1.4}
  .scale{display:flex;gap:6px}
  .scale button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);font-size:13px;color:var(--ink-2);font-family:"Geist Mono",monospace}
  .scale button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .bool{display:flex;gap:6px}
  .bool button{padding:6px 14px;border-radius:8px;border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
  .bool button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .save{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .save button.primary{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;font-weight:500;letter-spacing:-0.005em}
  .save button.primary:disabled{opacity:0.35;cursor:not-allowed}
  .save .hint{font-size:12px;color:var(--ink-3)}

  /* Entries */
  .entries{display:flex;flex-direction:column}
  .entry{display:grid;grid-template-columns:88px 1fr auto;gap:18px;padding:14px 4px;border-bottom:1px solid var(--line);align-items:baseline}
  .entry:last-child{border-bottom:none}
  .entry .when{font-size:12px;color:var(--ink-3);font-family:"Geist Mono",monospace;font-feature-settings:"tnum"}
  .entry .what{display:flex;flex-direction:column;gap:3px}
  .entry .name{font-size:14px;display:flex;align-items:center;gap:8px}
  .entry .name .dot{width:6px;height:6px;border-radius:50%}
  .entry .note{font-size:13px;color:var(--ink-3);line-height:1.45}
  .entry .val{font-family:"Geist Mono",monospace;font-size:15px;font-feature-settings:"tnum";font-weight:500}
  .entry .val .u{color:var(--ink-3);font-weight:400;font-size:12px;margin-left:3px}
  .entry .actions{opacity:0;transition:opacity .12s;display:flex;gap:2px}
  .entry:hover .actions{opacity:1}
  .entry .actions button{font-size:11px;color:var(--ink-3);padding:3px 6px;border-radius:4px}
  .entry .actions button:hover{color:var(--ink);background:var(--bg-2)}
  .entry .actions button:last-child:hover{color:var(--warn)}

  .day-group{margin-bottom:6px}
  .day-head{font-size:11px;color:var(--ink-3);letter-spacing:0.12em;text-transform:uppercase;padding:18px 4px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  .day-head .count{color:var(--ink-3)}

  .empty{padding:60px 20px;text-align:center;color:var(--ink-3);font-size:14px}
  .empty .em-serif{font-family:"Instrument Serif",serif;font-style:italic;font-size:24px;color:var(--ink-2);margin-bottom:6px;display:block}

  /* Vues */
  .vue-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .vue-mode{display:flex;gap:2px;background:var(--bg-2);padding:3px;border-radius:8px;border:1px solid var(--line)}
  .vue-mode button{padding:5px 12px;border-radius:6px;font-size:12px;color:var(--ink-2)}
  .vue-mode button.on{background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
  .range{display:flex;gap:14px;font-size:12px;color:var(--ink-3);letter-spacing:0.04em;text-transform:uppercase}
  .range button.on{color:var(--ink)}

  /* Chart layout bar */
  .layout-bar{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .layout-label{font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-3);font-weight:500}
  .vue-mode.small button{padding:4px 10px;font-size:11.5px;display:inline-flex;align-items:center;gap:6px;color:var(--ink-3)}
  .vue-mode.small button svg{opacity:0.7}
  .vue-mode.small button.on{color:var(--ink)}
  .vue-mode.small button.on svg{opacity:1}
  .vue-mode.small button:disabled{opacity:0.3;cursor:not-allowed}
  .chart-grid-layout{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px;margin-bottom:14px}
  .chart-card.compact{padding:14px 16px}
  .chart-card.compact .chart-head{margin-bottom:8px}
  .chart-card.compact .stats{font-size:11px}
  .chart-card.compact .stats .v{font-size:13px}

  /* Master legend */
  .master-legend{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .lg-item{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
  .lg-dot{width:8px;height:8px;border-radius:50%}
  .lg-name{color:var(--ink-2)}
  .lg-val{color:var(--ink);font-weight:500;font-size:12px;font-feature-settings:"tnum"}
  .hover-date{margin-top:8px;font-size:11px;color:var(--ink-3);font-family:"Geist Mono",monospace;text-align:center}

  /* Trend foot */
  .trend-foot{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);line-height:1.5;max-width:560px}
  .trend-foot .serif{color:var(--ink-2);margin-right:4px}

  /* Chart */
  .chart-card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:14px}
  .chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}
  .chart-head .name{font-size:14px;display:flex;align-items:center;gap:8px}
  .chart-head .name .dot{width:8px;height:8px;border-radius:50%}
  .chart-head .stats{display:flex;gap:20px;font-size:12px;color:var(--ink-3)}
  .chart-head .stats .v{color:var(--ink);font-family:"Geist Mono",monospace;font-weight:500;font-size:14px;font-feature-settings:"tnum"}
  .chart-svg{width:100%;height:160px;display:block}
  .chart-axis{font-family:"Geist Mono",monospace;font-size:10px;fill:var(--ink-3)}
  .chart-grid{stroke:var(--line);stroke-dasharray:2 4}

  /* Calendar heatmap */
  .heat{display:grid;grid-template-columns:repeat(53,1fr);gap:3px;margin-top:6px}
  .heat .cell{aspect-ratio:1;border-radius:2px;background:var(--bg-2);position:relative}
  .heat .cell[data-v="1"]{background:oklch(0.92 0.04 150)}
  .heat .cell[data-v="2"]{background:oklch(0.80 0.07 150)}
  .heat .cell[data-v="3"]{background:oklch(0.65 0.10 150)}
  .heat .cell[data-v="4"]{background:oklch(0.50 0.12 150)}
  .heat .cell.empty{background:transparent}
  .heat-legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3);margin-top:12px}
  .heat-legend .lg{width:10px;height:10px;border-radius:2px}

  /* Grid view (recent values grid) */
  .gridview{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
  .gv-card{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
  .gv-card .label{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.1em;display:flex;align-items:center;gap:6px}
  .gv-card .label .dot{width:6px;height:6px;border-radius:50%}
  .gv-card .v{font-family:"Geist Mono",monospace;font-size:24px;font-weight:500;font-feature-settings:"tnum"}
  .gv-card .v .u{color:var(--ink-3);font-size:13px;font-weight:400;margin-left:3px}
  .gv-card .trend{font-size:11px;color:var(--ink-3);font-family:"Geist Mono",monospace}
  .gv-card .trend.up{color:oklch(0.55 0.10 150)}
  .gv-card .trend.down{color:oklch(0.55 0.10 30)}

  /* Modal */
  .scrim{position:fixed;inset:0;background:rgba(28,27,24,.32);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;animation:fade .14s ease-out}
  @keyframes fade{from{opacity:0}}
  .modal{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:440px;box-shadow:0 24px 60px -20px rgba(0,0,0,.2)}
  .modal h2{margin:0 0 4px;font-size:17px;font-weight:500;letter-spacing:-0.01em}
  .modal .modal-sub{font-size:13px;color:var(--ink-3);margin-bottom:18px}
  .typegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
  .typegrid button{padding:10px 6px;border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--ink-2);background:var(--bg);text-align:left;display:flex;flex-direction:column;gap:3px}
  .typegrid button .ty{font-size:13px;color:var(--ink)}
  .typegrid button .desc{font-size:10.5px;color:var(--ink-3);text-transform:none;letter-spacing:0}
  .typegrid button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .typegrid button.on .ty,.typegrid button.on .desc{color:var(--bg)}
  .swatches{display:flex;gap:6px;flex-wrap:wrap}
  .swatches button{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);position:relative}
  .swatches button.on{outline:2px solid var(--ink);outline-offset:2px}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
  .modal-actions .ghost{font-size:13px;padding:8px 14px;border-radius:8px;color:var(--ink-2)}
  .modal-actions .ghost:hover{background:var(--bg-2)}
  .modal-actions .primary{background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500}
  .modal-actions .primary:disabled{opacity:0.35;cursor:not-allowed}
  .modal-actions .danger{font-size:13px;padding:8px 12px;border-radius:8px;color:var(--warn);margin-right:auto}
  .modal-actions .danger:hover{background:var(--bg-2)}

  .seg{display:flex;gap:6px}
  .seg button{padding:6px 10px;border:1px solid var(--line);border-radius:7px;font-size:12px;color:var(--ink-2);background:var(--bg)}
  .seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

  hr.thin{border:none;border-top:1px solid var(--line);margin:18px 0}

  .footer-note{margin-top:28px;font-size:12px;color:var(--ink-3);text-align:center}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script type="text/babel" src="app.jsx"></script>
</body>
</html>
