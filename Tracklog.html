<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<script>
  // Set before the stylesheet is parsed, so the chosen style never flashes the
  // wrong colours on load. A device preference, not account data — read here
  // without waiting on Supabase auth to resolve.
  // STYLE_IDS doubles the list held in app.jsx (STYLES) on purpose: this runs
  // before any script loads, so it cannot read it. Adding a style means adding
  // its id here too — and a stored value outside the list falls back to dark
  // rather than leaving the page with no tokens at all.
  var STYLE_IDS = ['dark', 'light'];
  try{
    var t = localStorage.getItem('tracklog.theme');
    if (STYLE_IDS.indexOf(t) !== -1) document.documentElement.dataset.theme = t;
  } catch(e){}
</script>
<title>Tracklog</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Tracklog" />
<meta name="theme-color" content="#100f0d" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Tracklog — "Aristide" dark editorial theme
     Warm near-black canvas, off-white type, burnt-orange accent,
     large italic serif display against small tracked uppercase
     labels, sharp technical grid, slow cinematic motion, and a
     desktop custom cursor. Class names are unchanged from the
     original so app.jsx behaviour is identical.
     ============================================================ */
  :root{
    --radius: 3px;
    --ease: cubic-bezier(.19,1,.22,1);
  }
  /* Dark — "Aristide": warm near-black canvas, off-white ink. The default,
     and what every existing user already has, so it's the un-attributed root. */
  :root, :root[data-theme="dark"]{
    --bg: #100f0d;
    --bg-2: #191712;
    --bg-3: #221f18;
    --ink: #efe9dd;
    --ink-2: #a7a094;
    --ink-3: #6d675b;
    --line: rgba(239,233,221,.10);
    --line-2: rgba(239,233,221,.22);
    --accent: #e2542f;
    --accent-2: #d14836;
    --accent-soft: rgba(226,84,47,.14);
    --warn: #e2542f;
    --vignette: rgba(0,0,0,.55);
  }
  /* Light — same editorial bones, warm cream canvas instead of near-black,
     white elevated cards for depth, same burnt-orange accent throughout. */
  :root[data-theme="light"]{
    --bg: #f6f2e9;
    --bg-2: #ffffff;
    --bg-3: #ece5d6;
    --ink: #211d17;
    --ink-2: #6b6355;
    --ink-3: #9a9280;
    --line: rgba(33,29,23,.09);
    --line-2: rgba(33,29,23,.18);
    --accent: #e2542f;
    --accent-2: #d14836;
    --accent-soft: rgba(226,84,47,.11);
    --warn: #c8402a;
    --vignette: rgba(33,29,23,.05);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;overflow-x:hidden;scroll-behavior:smooth}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"Geist",ui-sans-serif,system-ui,sans-serif;font-feature-settings:"ss01","cv11";-webkit-font-smoothing:antialiased;transition:background .3s var(--ease),color .3s var(--ease)}
  body{min-height:100vh;overflow-x:hidden;touch-action:manipulation}
  ::selection{background:var(--accent);color:#fff}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line-2)}
  ::-webkit-scrollbar-track{background:transparent}

  /* Cinematic vignette + subtle top glow, behind everything. The bottom vignette
     deepens toward black on the dark canvas but must stay barely-there on a light
     one — --vignette carries that per-theme, rather than a flat rgba(0,0,0,.55)
     smudging the bottom of a cream page. */
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(226,84,47,.07), transparent 55%),
      radial-gradient(100% 100% at 50% 120%, var(--vignette), transparent 55%)}

  .mono{font-family:"Geist Mono",ui-monospace,monospace;font-feature-settings:"tnum"}
  .serif{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
  input,select,textarea{font-family:inherit;font-size:14px;color:inherit;background:transparent;border:none;outline:none}
  input::placeholder,textarea::placeholder{color:var(--ink-3)}
  select option{background:var(--bg-2);color:var(--ink)}

  /* Entrance motion — plays once on mount, in-place React updates don't restart it */
  @keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .card,.chart-card,.today-card,.tk-card,.gv-card,.cal,.entry,
  .log-subnav,.trackers-head,.vue-controls,.day-editor-head,.rail-wrap{animation:riseIn .7s var(--ease) both}
  .today-grid>*:nth-child(2),.trackers-grid>*:nth-child(2){animation-delay:.05s}
  .today-grid>*:nth-child(3),.trackers-grid>*:nth-child(3){animation-delay:.10s}
  .today-grid>*:nth-child(4),.trackers-grid>*:nth-child(4){animation-delay:.15s}
  .today-grid>*:nth-child(5),.trackers-grid>*:nth-child(5){animation-delay:.20s}
  .today-grid>*:nth-child(6),.trackers-grid>*:nth-child(6){animation-delay:.25s}
  .entry:nth-child(2){animation-delay:.04s}
  .entry:nth-child(3){animation-delay:.08s}
  .entry:nth-child(4){animation-delay:.12s}
  .entry:nth-child(5){animation-delay:.16s}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;scroll-behavior:auto}}

  /* Layout */
  .app{max-width:1080px;margin:0 auto;padding:40px 32px 100px;position:relative;z-index:1}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;gap:24px;margin-bottom:14px;padding-bottom:22px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:baseline;gap:12px}
  .brand .mark{width:9px;height:9px;background:var(--accent);border-radius:0;transform:translateY(-1px) rotate(45deg);box-shadow:0 0 16px rgba(226,84,47,.6)}
  .brand h1{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;font-size:28px;letter-spacing:0;margin:0;line-height:1}
  .brand .by{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.16em}
  .tabs{display:flex;gap:26px;background:none;padding:0;border:none}
  .tabs button{padding:2px 0;border-radius:0;font-size:11px;color:var(--ink-3);font-weight:500;letter-spacing:0.16em;text-transform:uppercase;position:relative;transition:color .4s var(--ease)}
  .tabs button::after{content:'';position:absolute;left:0;right:100%;bottom:-4px;height:1px;background:var(--accent);transition:right .45s var(--ease)}
  .tabs button:hover{color:var(--ink)}
  .tabs button.active{color:var(--ink)}
  .tabs button.active::after{right:0}
  .topbar-actions{display:flex;align-items:center;gap:22px}
  .account-btn{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.14em;transition:color .4s var(--ease)}
  .account-btn:hover{color:var(--accent)}
  /* Settings: a gear replaces the two loose "Mot de passe"/"Déconnexion" text
     buttons that used to sit in the top bar — one icon, one destination. */
  .gear-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:var(--ink-3);transition:color .3s var(--ease),background .3s var(--ease)}
  .gear-btn:hover{color:var(--ink);background:var(--bg-3)}
  .gear-btn.active{color:var(--accent)}
  .gear-btn svg{transition:transform .4s var(--ease)}
  .gear-btn:hover svg{transform:rotate(25deg)}
  .settings-view{max-width:480px}
  .settings-card{margin-bottom:20px}
  .settings-section-title{font-family:"Instrument Serif",serif;font-style:italic;font-size:19px;margin:0 0 6px}
  .settings-value{font-size:13px;color:var(--ink-2)}
  .settings-hint{font-size:12px;color:var(--ink-3);line-height:1.6;margin:12px 0 0}
  /* Archived trackers have no card anywhere else to carry a gear icon — this list,
     opening the same TrackerModal as everything else, is their only way back. */
  .archive-list{display:flex;flex-direction:column;gap:2px}
  .archive-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 4px;
    border:none;border-top:1px solid var(--line);background:none;color:var(--ink);
    text-align:left;cursor:pointer;transition:background .3s var(--ease)}
  .archive-row:first-child{border-top:none}
  .archive-row:hover{background:var(--bg-3)}
  .archive-row .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .archive-name{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge,.archive-type,.rail-sort-tag,.tc-badge,.tk-type,.tk-chip,.master-tag,.ms-partial{
    padding:2px 8px;border-radius:999px}
  .archive-type{font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-3);
    border:1px solid var(--line-2);flex-shrink:0}
  .settings-hint .k{color:var(--ink-2)}
  .settings-inline-hint{font-size:11px;color:var(--ink-3);line-height:1.5}

  /* Sélecteur de style — chaque choix montre les couleurs qu'il applique,
     puisque c'est très exactement ce qu'on choisit. */
  .style-picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;width:100%}
  .style-choice{display:flex;flex-direction:column;align-items:flex-start;gap:6px;cursor:pointer;
    padding:12px 13px;border:1px solid var(--line);border-radius:var(--radius);background:none;text-align:left;
    transition:border-color .4s var(--ease),background .4s var(--ease)}
  .style-choice:hover{border-color:var(--line-2)}
  .style-choice.on{border-color:var(--accent);background:var(--accent-soft)}
  .style-swatch{display:flex;gap:3px}
  .style-swatch i{width:16px;height:16px;border-radius:2px;border:1px solid rgba(128,128,128,.25)}
  .style-swatch[data-style="dark"] i:nth-child(1){background:#100f0d}
  .style-swatch[data-style="dark"] i:nth-child(2){background:#efe9dd}
  .style-swatch[data-style="dark"] i:nth-child(3){background:#e2542f}
  .style-swatch[data-style="light"] i:nth-child(1){background:#f6f2e9}
  .style-swatch[data-style="light"] i:nth-child(2){background:#211d17}
  .style-swatch[data-style="light"] i:nth-child(3){background:#e2542f}
  .style-name{font-size:13px;color:var(--ink)}
  .style-hint{font-size:11px;color:var(--ink-3);line-height:1.45}

  /* Retours */
  .feedback-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:4px}
  .feedback-foot .settings-inline-hint{flex:1}

  /* Training — l'onglet réservé */
  .training-empty{max-width:520px;margin:0 auto;text-transform:none;letter-spacing:0;line-height:1.7;font-size:14px}
  .training-empty .k{color:var(--ink-2)}
  .training-note{display:block;margin-top:18px;font-size:12px;color:var(--ink-3)}

  /* Tracker rail */
  .rail-wrap{border-bottom:1px solid var(--line);margin-bottom:34px}
  .rail-toggle{display:inline-flex;align-items:center;gap:8px;padding:16px 0;font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-3);transition:color .3s var(--ease)}
  .rail-toggle:hover{color:var(--ink)}
  .rail-toggle svg{transition:transform .3s var(--ease)}
  .rail-toggle.open svg{transform:rotate(180deg)}
  .rail-count{background:var(--accent);color:#fff;font-size:10px;font-family:"Geist Mono",monospace;border-radius:999px;padding:1px 7px;line-height:1.5}
  /* An active sort is announced on the collapsed toggle, so the list order is never
     silently different from the one you arranged. */
  .rail-sort-tag{font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-2);border:1px solid var(--line-2)}
  .rail-sort{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 0 16px}
  .rail-sort-label{font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-3)}
  .rail{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 0 22px}
  /* line-height:1 fixe une vraie incohérence : le glyphe « ＋ » pleine chasse
     porte, dans la plupart des polices, une hauteur de ligne plus grande que le
     texte autour de lui — sans le forcer, la même classe .pill.add rendait à
     30px ou 33px selon que le bouton portait ce caractère ou non. */
  .pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-size:12px;line-height:1;letter-spacing:0.02em;background:transparent;border:1px solid var(--line-2);color:var(--ink-2);transition:color .4s var(--ease),border-color .4s var(--ease),background .4s var(--ease),transform .4s var(--ease)}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .pill:hover{border-color:var(--ink-2);color:var(--ink);transform:translateY(-1px)}
  .pill.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .pill.active .dot{outline:2px solid rgba(16,15,13,.25)}
  /* Selection kept in reserve while "Tout" overrides it — greyed, not lost. */
  .pill.dimmed{background:var(--bg-3);color:var(--ink-2);border-color:var(--ink-3)}
  .pill.dimmed .dot{opacity:.85}
  .pill.add{color:var(--ink-3);border-style:dashed;background:transparent}
  .pill.add:hover{color:var(--accent);border-color:var(--accent)}

  /* Log layout */
  .grid2{display:grid;grid-template-columns:1fr 320px;gap:40px;align-items:start}
  @media(max-width:840px){.grid2{grid-template-columns:1fr}}

  .section-label{font-size:10px;text-transform:uppercase;letter-spacing:0.18em;color:var(--ink-3);margin:0 0 18px;font-weight:500}

  /* Quick add card */
  .card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:22px;transition:border-color .5s var(--ease)}
  .card:hover{border-color:var(--line-2)}
  .qa{position:relative}
  .qa h3{margin:0 0 4px;font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;font-size:22px;letter-spacing:0}
  .qa .sub{font-size:12px;color:var(--ink-3);margin-bottom:16px;text-transform:uppercase;letter-spacing:0.1em}
  .field{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}
  .field:last-of-type{border-bottom:none}
  .field label{font-size:10px;color:var(--ink-3);width:82px;flex-shrink:0;text-transform:uppercase;letter-spacing:0.12em}
  .field input,.field select,.field textarea{flex:1;font-size:14px}
  .field .unit{color:var(--ink-3);font-size:13px;margin-left:6px}
  .field textarea{resize:none;min-height:20px;line-height:1.4}
  .scale{display:flex;gap:6px;flex-wrap:wrap}
  .scale button{width:34px;height:34px;border-radius:0;border:1px solid var(--line-2);font-size:13px;color:var(--ink-2);font-family:"Geist Mono",monospace;transition:all .35s var(--ease)}
  .scale button:hover{border-color:var(--ink-2);color:var(--ink)}
  .scale button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  /* Scale slider — fills the room left of the save button. The accent portion is
     driven by a --fill custom property so the track reads as a gauge, not a plain bar. */
  .scale-slider{display:flex;align-items:center;gap:10px;width:100%;min-width:0}
  .scale-slider input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:18px;background:transparent;cursor:pointer}
  .scale-slider input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;
    background:linear-gradient(to right,var(--accent) var(--fill,50%),var(--line-2) var(--fill,50%))}
  .scale-slider input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--line-2)}
  .scale-slider input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--accent)}
  .scale-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ink);border:none;margin-top:-5.5px;transition:transform .2s var(--ease),background .2s var(--ease)}
  .scale-slider input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:none}
  .scale-slider input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.15)}
  .scale-slider input[type=range]:active::-webkit-slider-thumb{background:var(--accent)}
  .scale-slider input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
  .scale-val{font-family:"Geist Mono",monospace;font-feature-settings:"tnum";font-size:15px;font-weight:500;flex-shrink:0;min-width:34px;text-align:right}
  .scale-val.unset{color:var(--ink-3)}
  .scale-val .scale-max{font-size:11px;color:var(--ink-3);font-weight:400}
  .bool{display:flex;gap:8px}
  .bool button{padding:7px 15px;border-radius:999px;border:1px solid var(--line-2);font-size:12px;color:var(--ink-2);transition:all .35s var(--ease)}
  .bool button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .save{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .btn-primary,.save button.primary,.modal-actions .primary,.submit-all,.chrono-add-big,.fd-primary{
    background:var(--accent);color:#fff;border-radius:999px;padding:12px 22px;
    font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.12em}
  .save button.primary{transition:transform .35s var(--ease),background .35s var(--ease)}
  .save button.primary:hover{background:#f0613b}
  .save button.primary:active{transform:scale(.97)}
  .save button.primary:disabled{opacity:0.3;cursor:not-allowed}
  .save .hint{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.08em}

  /* Entries */
  .entries{display:flex;flex-direction:column}
  .entry{display:grid;grid-template-columns:92px 1fr auto;gap:20px;padding:16px 6px;border-bottom:1px solid var(--line);align-items:baseline;transition:padding-left .4s var(--ease),background .4s var(--ease)}
  .entry:last-child{border-bottom:none}
  .entry:hover{padding-left:14px}
  .entry .when{font-size:11px;color:var(--ink-3);font-family:"Geist Mono",monospace;font-feature-settings:"tnum";text-transform:uppercase;letter-spacing:0.05em}
  .entry .what{display:flex;flex-direction:column;gap:3px}
  .entry .name{font-size:14px;display:flex;align-items:center;gap:8px}
  .entry .name .dot{width:6px;height:6px;border-radius:50%}
  .entry .note{font-size:13px;color:var(--ink-3);line-height:1.45}
  .entry .val{font-family:"Geist Mono",monospace;font-size:16px;font-feature-settings:"tnum";font-weight:500}
  .entry .val .u{color:var(--ink-3);font-weight:400;font-size:12px;margin-left:3px}
  .entry .actions{opacity:0;transition:opacity .4s var(--ease);display:flex;gap:4px}
  .entry:hover .actions{opacity:1}
  .entry .actions button{font-size:10px;color:var(--ink-3);padding:4px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:0.08em;transition:color .3s,background .3s}
  .entry .actions button:hover{color:var(--ink);background:var(--bg-3)}
  .entry .actions button:last-child:hover{color:var(--warn)}

  .day-group{margin-bottom:6px}
  .day-head{font-size:10px;color:var(--ink-3);letter-spacing:0.18em;text-transform:uppercase;padding:22px 6px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  .day-head .count{color:var(--ink-3)}

  .empty{padding:80px 20px;text-align:center;color:var(--ink-3);font-size:13px;text-transform:uppercase;letter-spacing:0.1em}
  .empty .em-serif{font-family:"Instrument Serif",serif;font-style:italic;font-size:30px;color:var(--ink-2);margin-bottom:10px;display:block;text-transform:none;letter-spacing:0}

  /* Initial boot placeholder, swapped for the React app once it mounts (or
     for an explanatory message if boot fails — see the watchdog script). */
  .boot-fallback{padding:120px 20px;text-align:center;color:var(--ink-3);font-size:13px}
  .boot-fallback .em-serif{font-family:"Instrument Serif",serif;font-style:italic;font-size:30px;color:var(--ink-2);margin-bottom:14px;display:block}
  .boot-fallback p{max-width:440px;margin:0 auto;line-height:1.6;font-size:13px}

  /* Vues */
  .vue-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}

  /* ------------------------------------------------------------------
     Segmented — le seul mécanisme de bascule de l'app. Un fond qui glisse
     (mesuré en JS par le composant React `Segmented`, .seg-thumb) derrière
     l'option active, plutôt que chaque bouton qui change sa propre couleur
     de fond en place — c'est ce qui fait le glissé plutôt que le fondu.
     Trois tailles nommées, chacune un vrai choix :
       (par défaut)  chips à leur propre contour, texte en minuscule — les
                      options d'une modale ("Une / jour" / "Plusieurs / jour").
       .compact      piste unique en capitales tassées — la nav principale
                      (Jour/Historique/Chrono, Graphes/Calendrier/Grille).
       .small        la même piste compacte, un cran plus petit — tri du
                      rail, onglets de bibliothèque, densité des graphes.
     ------------------------------------------------------------------ */
  .seg-track{position:relative;display:inline-flex;gap:6px;flex-wrap:wrap}
  .seg-track.wrap{flex-wrap:wrap}
  .seg-thumb{position:absolute;top:0;left:0;background:var(--ink);border-radius:999px;z-index:0;
    transition:transform .35s var(--ease),width .35s var(--ease),height .35s var(--ease);pointer-events:none}
  .seg-track button{position:relative;z-index:1;padding:7px 12px;border:1px solid var(--line-2);border-radius:999px;
    font-size:12px;color:var(--ink-2);background:transparent;font-family:inherit;
    transition:color .35s var(--ease),border-color .35s var(--ease)}
  .seg-track button.on{color:var(--bg);border-color:transparent}
  .seg-track button:disabled{opacity:0.4;cursor:not-allowed}

  .seg-track.compact,.seg-track.small{gap:2px;background:var(--bg-2);padding:3px;border-radius:999px;border:1px solid var(--line);flex-wrap:nowrap}
  .seg-track.compact button,.seg-track.small button{border:none;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.1em;white-space:nowrap}
  .seg-track.compact button{padding:6px 14px;font-size:11px}
  .seg-track.small button{padding:5px 11px;font-size:10.5px;display:inline-flex;align-items:center;gap:6px}
  .seg-track.small button svg{opacity:0.7;transition:opacity .35s var(--ease)}
  .seg-track.small button.on svg{opacity:1}

  .seg-track.disabled{opacity:0.5}
  .seg-track.disabled button{cursor:not-allowed}

  .range{display:flex;align-items:center;gap:18px;font-size:11px;color:var(--ink-3);letter-spacing:0.12em;text-transform:uppercase;flex-wrap:wrap}
  .range button{transition:color .35s var(--ease)}
  .range button:hover{color:var(--ink-2)}
  .range button.on{color:var(--accent)}
  .range-custom-date{font-size:11px;color:var(--ink);background:var(--bg-2);border:1px solid var(--line-2);
    border-radius:6px;padding:3px 6px;letter-spacing:normal;text-transform:none}

  /* Chart layout bar */
  .layout-bar{display:flex;align-items:center;gap:16px;margin-bottom:18px}
  .layout-label{font-size:10px;text-transform:uppercase;letter-spacing:0.18em;color:var(--ink-3);font-weight:500}
  /* Combien de cartes par ligne — le curseur écrit `data-per`, une valeur par
     règle plutôt qu'un `repeat()` calculé : la fonction repeat() n'accepte pas
     de calc() pour son nombre de colonnes, donc pas de min() pour brider les
     petits écrans. Les paliers ci-dessous s'en chargent explicitement. */
  .chart-grid-layout{display:grid;gap:14px;margin-bottom:14px;grid-template-columns:1fr}
  .chart-grid-layout[data-per="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chart-grid-layout[data-per="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
  .chart-grid-layout[data-per="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
  /* La carte porte déjà sa marge basse quand elle vit hors grille ; ici le gap
     s'en charge, sinon les lignes s'écartent de 28 px au lieu de 14. */
  .chart-grid-layout>.chart-card{margin-bottom:0}
  @media (max-width:1100px){ .chart-grid-layout[data-per="4"]{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media (max-width:880px){ .chart-grid-layout[data-per="3"],.chart-grid-layout[data-per="4"]{grid-template-columns:repeat(2,minmax(0,1fr))} }

  /* Le curseur « − / + ». Même famille que le curseur d'échelle, en plus court. */
  .per-row{display:flex;align-items:center;gap:9px;flex-shrink:0}
  .per-row-end{font-size:13px;color:var(--ink-3);line-height:1;user-select:none}
  .per-row input[type=range]{-webkit-appearance:none;appearance:none;width:92px;height:18px;background:transparent;cursor:pointer}
  .per-row input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;
    background:linear-gradient(to right,var(--accent) var(--fill,0%),var(--line-2) var(--fill,0%))}
  .per-row input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--line-2)}
  .per-row input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--accent)}
  .per-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;background:var(--ink);border:none;margin-top:-5px;transition:transform .2s var(--ease),background .2s var(--ease)}
  .per-row input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--ink);border:none}
  .per-row input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.15)}
  .per-row input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
  .per-row-n{font-size:12px;color:var(--ink-3);font-feature-settings:"tnum";min-width:9px;text-align:right}

  /* Palier le plus serré : la carte se déleste aussi de son cadre visuel. */
  .chart-card.dense{padding:12px 13px}
  .chart-card.dense .chart-head{margin-bottom:6px;gap:8px}
  .chart-card.dense .chart-head .name{font-size:12px;gap:6px}
  .chart-card.dense .stats{font-size:10px;gap:10px}
  .chart-card.dense .stats .v{font-size:12px}
  .chart-card.dense .chart-edit-btn{width:20px;height:20px}
  .chart-card.dense .chart-axis{font-size:9px}
  .chart-card.dense .drag-handle{display:none}
  .chart-card.compact{padding:16px 18px}
  .chart-card.compact .chart-head{margin-bottom:8px}
  .chart-card.compact .stats{font-size:11px}
  .chart-card.compact .stats .v{font-size:13px}

  /* Master legend */
  .master-legend{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .lg-item{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
  .lg-dot{width:8px;height:8px;border-radius:50%}
  .lg-name{color:var(--ink-2)}
  .lg-val{color:var(--ink);font-weight:500;font-size:12px;font-feature-settings:"tnum";font-family:"Geist Mono",monospace}
  .hover-date{margin-top:8px;font-size:11px;color:var(--ink-3);font-family:"Geist Mono",monospace;text-align:center}

  /* Trend foot */
  .trend-foot{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3);line-height:1.6;max-width:560px}
  .trend-foot .serif{color:var(--accent);margin-right:4px}

  /* Chart */
  .chart-card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:14px;transition:border-color .5s var(--ease),transform .5s var(--ease)}
  .chart-card:hover{border-color:var(--line-2)}
  .chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px;gap:12px}
  .chart-head .name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
  /* A long name is cut with an ellipsis rather than pushing the stats out of the
     card — see "Un nom long se coupe" below. */
  .chart-head .name>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chart-head .name .dot{width:8px;height:8px;border-radius:50%}
  .chart-head .stats{display:flex;gap:22px;font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.06em;flex-shrink:0}
  .chart-head .stats .v{color:var(--ink);font-family:"Geist Mono",monospace;font-weight:500;font-size:14px;font-feature-settings:"tnum";letter-spacing:0}
  .chart-head-right{display:flex;align-items:center;gap:14px}

  /* ------------------------------------------------------------------
     Icon-btn — le rond à icône ou glyphe seul : engrenage d'une carte,
     flèche du calendrier, croix de suppression, lien source. Un seul
     composant pour la forme (cercle, contour, transition), deux tailles
     nommées (26px par défaut, .sm à 20px pour les endroits vraiment
     étroits — tuile de la Grille, infobulle flottante, bulle d'aide)
     à la place des six valeurs qui s'étaient accumulées une par une.
     La couleur et la réaction au survol restent propres à chaque
     usage à côté — un survol qui vire au rouge pour une suppression
     n'a pas à ressembler à un survol neutre. */
  .icon-btn{cursor:pointer;width:26px;height:26px;padding:0;border-radius:50%;flex-shrink:0;
    display:inline-flex;align-items:center;justify-content:center;background:transparent;
    border:1px solid var(--line-2);color:var(--ink-3);
    transition:color .3s var(--ease),border-color .3s var(--ease),background .3s var(--ease)}
  .icon-btn.sm{width:20px;height:20px}
  .icon-btn:disabled{opacity:0.3;cursor:not-allowed}

  .chart-edit-btn:hover{color:var(--ink-2);border-color:var(--ink-2);background:var(--accent-soft)}
  .chart-svg{width:100%;height:160px;display:block}
  .chart-svg-wrap{width:100%}
  .chart-axis{font-family:"Geist Mono",monospace;font-size:10px;fill:var(--ink-3)}

  /* Floating tooltip that pops up while scrubbing a chart with mouse or touch */
  .chart-tooltip{position:absolute;top:8px;transform:translateX(-50%);z-index:5;
    background:var(--bg-3);border:1px solid var(--line-2);border-radius:var(--radius);
    padding:9px 30px 9px 12px;min-width:120px;box-shadow:0 8px 24px rgba(0,0,0,.35);
    pointer-events:auto;animation:tooltip-in .15s var(--ease)}
  .chart-tooltip.left{transform:translateX(0);animation:none}
  .chart-tooltip.right{transform:translateX(-100%);animation:none}
  @keyframes tooltip-in{from{opacity:0;transform:translateX(-50%) translateY(-3px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  .chart-tooltip-date{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:3px}
  .chart-tooltip-value{font-family:"Geist Mono",monospace;font-size:14px;font-feature-settings:"tnum";color:var(--ink)}
  .chart-tooltip-close,.chart-tooltip-edit{position:absolute;background:var(--bg-2)}
  .chart-tooltip-close{top:-8px;right:-8px}
  .chart-tooltip-edit{bottom:-8px;right:-8px;color:var(--accent)}
  .chart-tooltip-close:hover{color:var(--ink);border-color:var(--ink-2)}
  .chart-tooltip-edit:hover{background:var(--accent-soft);border-color:var(--accent)}
  @media (max-width:640px){
    .chart-tooltip{padding:10px 32px 10px 14px;min-width:130px}
    .chart-tooltip-close,.chart-tooltip-edit{width:24px;height:24px}
  }
  .chart-grid{stroke:var(--line);stroke-dasharray:2 4}

  /* Calendar heatmap */
  .heat{display:grid;grid-template-columns:repeat(53,1fr);gap:3px;margin-top:6px}
  .heat .cell{aspect-ratio:1;border-radius:1px;background:var(--bg-3);position:relative}
  .heat .cell[data-v="1"]{background:rgba(226,84,47,.22)}
  .heat .cell[data-v="2"]{background:rgba(226,84,47,.42)}
  .heat .cell[data-v="3"]{background:rgba(226,84,47,.66)}
  .heat .cell[data-v="4"]{background:var(--accent)}
  .heat .cell.empty{background:transparent}
  .heat-legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3);margin-top:12px;text-transform:uppercase;letter-spacing:0.08em}
  .heat-legend .lg{width:10px;height:10px;border-radius:1px}

  /* Grid view (recent values grid) */
  .gridview{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
  .gv-card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:6px;transition:border-color .5s var(--ease),transform .5s var(--ease)}
  .gv-card:hover{border-color:var(--line-2);transform:translateY(-2px)}
  .gv-card .label{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.12em;display:flex;align-items:center;justify-content:space-between;gap:6px}
  .gv-card .label>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gv-card .label .dot{width:6px;height:6px;border-radius:50%}
  .gv-card .v{font-family:"Geist Mono",monospace;font-size:26px;font-weight:500;font-feature-settings:"tnum"}
  .gv-card .v .u{color:var(--ink-3);font-size:13px;font-weight:400;margin-left:3px}
  .gv-card .trend{font-size:11px;color:var(--ink-3);font-family:"Geist Mono",monospace}
  .gv-card .trend.up{color:var(--accent)}
  .gv-card .trend.down{color:var(--ink-3)}

  /* Modal */
  .scrim{position:fixed;inset:0;background:rgba(8,7,6,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;animation:fadeIn .2s ease-out}
  @keyframes fade{from{opacity:0}}
  .modal{background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--radius);padding:28px;width:100%;max-width:440px;max-height:calc(100vh - 40px);overflow-y:auto;box-shadow:0 40px 80px -30px rgba(0,0,0,.8);animation:riseIn .5s var(--ease) both}
  .modal h2{margin:0 0 4px;font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;font-size:24px;letter-spacing:0}
  .modal .modal-sub{font-size:12px;color:var(--ink-3);margin-bottom:20px;text-transform:uppercase;letter-spacing:0.1em}
  .typegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
  .typegrid button{padding:12px 8px;border:1px solid var(--line-2);border-radius:var(--radius);font-size:12px;color:var(--ink-2);background:transparent;text-align:left;display:flex;flex-direction:column;gap:3px;transition:all .35s var(--ease)}
  .typegrid button:hover{border-color:var(--ink-2)}
  .typegrid button .ty{font-size:13px;color:var(--ink)}
  .typegrid button .desc{font-size:10.5px;color:var(--ink-3);text-transform:none;letter-spacing:0}
  .typegrid button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .typegrid button.on .ty,.typegrid button.on .desc{color:#fff}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .swatches button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line-2);position:relative;transition:transform .3s var(--ease)}
  .swatches button:hover{transform:scale(1.12)}
  .swatches button.on{outline:2px solid var(--ink);outline-offset:2px}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px;border-top:1px solid var(--line);padding-top:18px}
  .modal-actions .ghost{font-size:11px;padding:10px 16px;border-radius:999px;color:var(--ink-2);text-transform:uppercase;letter-spacing:0.12em;transition:color .3s,background .3s}
  .modal-actions .ghost:hover{background:var(--bg-3);color:var(--ink)}
  .modal-actions .primary{transition:background .3s var(--ease)}
  .modal-actions .primary:hover{background:#f0613b}
  .modal-actions .primary:disabled{opacity:0.3;cursor:not-allowed}
  .modal-actions .danger{font-size:11px;padding:10px 12px;border-radius:999px;color:var(--warn);margin-right:auto;text-transform:uppercase;letter-spacing:0.12em;transition:background .3s}
  .modal-actions .danger:hover{background:var(--accent-soft)}

  /* Modal sections (Cœur / Paramètres) */
  .modal-section{font-family:"Instrument Serif",serif;font-style:italic;font-size:17px;color:var(--ink-2);margin:22px 0 2px;padding-top:16px;border-top:1px solid var(--line)}
  .modal-section.first{border-top:none;padding-top:2px;margin-top:8px}

  /* A control (seg) sitting on a row with a trailing info bubble */
  .ctl-with-info{flex:1;display:flex;align-items:center;gap:10px;min-width:0}

  /* Click-to-reveal info bubble */
  .info{position:relative;display:inline-flex;line-height:0;flex-shrink:0}
  .info-btn{font-size:11px;font-style:italic;font-family:"Instrument Serif",serif}
  .info-btn:hover,.info-btn.on{border-color:var(--accent);color:var(--accent)}
  .info-pop{position:absolute;top:calc(100% + 8px);right:0;width:250px;background:var(--bg-3);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.6;color:var(--ink-2);text-transform:none;letter-spacing:0;font-weight:400;z-index:6;box-shadow:0 20px 44px -22px rgba(0,0,0,.8);animation:fadeIn .15s ease-out}
  .info-pop .k{color:var(--ink);font-weight:500}

  /* Choices editor (in the tracker modal) */
  .choices-editor{display:flex;flex-direction:column;gap:8px;width:100%}
  .choice-row{display:flex;align-items:center;gap:8px}
  .choice-row input{flex:1;font-size:14px}
  .choice-del{font-size:16px;line-height:1}
  .choice-del:hover{border-color:var(--warn);color:var(--warn)}
  .choice-del:disabled{opacity:.3;cursor:not-allowed}
  .choice-add,.choices button,.member{font-size:12px;line-height:1;color:var(--ink-2);padding:7px 13px;border-radius:999px;background:transparent}
  .choice-add{align-self:flex-start;border:1px dashed var(--line-2);transition:border-color .3s,color .3s}
  .choice-add:hover{border-color:var(--accent);color:var(--accent)}

  /* Choice picker (when logging an entry) */
  .choices{display:flex;flex-wrap:wrap;gap:6px;width:100%}
  .choices button{border:1px solid var(--line-2);transition:all .35s var(--ease)}
  .choices button:hover{border-color:var(--ink-2);color:var(--ink)}
  .choices button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tc-empty-note{font-size:12px;color:var(--ink-3);font-style:italic;line-height:1.5}

  /* Drag-to-reorder — grip handle + lifted state, reused by every
     reorderable list (rail pills, day cards, tracker cards, master
     strips, chart cards). */
  .drag-handle{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;flex-shrink:0;color:var(--ink-3);opacity:.65;cursor:grab;touch-action:pan-y;border-radius:4px;transition:color .25s var(--ease),background .25s var(--ease),opacity .25s var(--ease)}
  .drag-handle:hover{color:var(--ink);background:var(--bg-3);opacity:1}
  .drag-handle svg circle{fill:currentColor}
  .drag-handle.dragging{cursor:grabbing;color:var(--accent);opacity:1}
  /* The dragged card stays fully visible and floats above the rest while it
     follows the pointer (transform applied inline). No opacity, no transition
     so it tracks the finger 1:1. */
  .dragging{z-index:1000 !important;cursor:grabbing;transition:none !important;animation:none !important;
            box-shadow:0 22px 46px -14px rgba(0,0,0,.7),0 0 0 1px var(--accent) !important}
  .dragging:hover{transform:none}
  body.dragging-reorder{cursor:grabbing}
  body.dragging-reorder *{user-select:none !important}
  /* The highlight bar parked in the target gap (positioned in JS, viewport coords). */
  .drop-indicator{position:fixed;display:none;z-index:999;pointer-events:none;
                  background:var(--accent);border-radius:3px;
                  box-shadow:0 0 10px 1px rgba(226,84,47,.75)}
  /* On commit the list reflows into its new order — keep the entrance
     animation from replaying on the cards that shifted. */
  body.reordering .today-card,body.reordering .tk-card,body.reordering .chart-card,
  body.reordering .gv-card,body.reordering .master-strip,body.reordering .pill{animation:none !important}
  .pill{cursor:grab;touch-action:pan-y}
  .pill.add{cursor:pointer}
  .pill.dragging{cursor:grabbing}

  /* Master member picker (in the tracker modal) */
  .member-picker{display:flex;flex-wrap:wrap;gap:6px;width:100%}
  .member{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);transition:all .35s var(--ease)}
  .member .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .member:hover{border-color:var(--ink-2);color:var(--ink)}
  .member.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .member.on .dot{outline:1px solid var(--bg);outline-offset:1px}

  /* Active period (dates + archive) */
  .period-toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
  .period-toggle input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
  .period-row{display:flex;gap:10px;width:100%}
  .period-field{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
  .period-field input{width:100%;min-width:0}
  .period-field span{font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-3)}
  .period-field input{font-size:13px;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;background:var(--bg-3);color:var(--ink)}
  .period-arch{align-self:flex-start;margin-top:2px;font-size:10px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:999px;padding:8px 14px;text-transform:uppercase;letter-spacing:0.12em;transition:all .35s var(--ease)}
  .period-arch:hover{border-color:var(--warn);color:var(--warn)}
  .period-arch.unarchive:hover{border-color:var(--accent);color:var(--accent)}

  .toggle{display:inline-flex;align-items:center;gap:10px;background:none;border:none;padding:0;cursor:pointer}
  .toggle .knob{width:42px;height:24px;border-radius:12px;background:var(--bg-3);border:1px solid var(--line-2);position:relative;flex-shrink:0;transition:background .4s var(--ease),border-color .4s var(--ease)}
  .toggle .knob::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink-2);transition:transform .4s var(--ease),background .4s var(--ease)}
  .toggle.on .knob{background:var(--accent);border-color:var(--accent)}
  .toggle.on .knob::after{transform:translateX(18px);background:#fff}
  .toggle .toggle-text{font-size:13px;color:var(--ink-2)}
  .field-hint{font-size:12px;color:var(--ink-3);line-height:1.5;padding:0 0 14px;border-bottom:1px solid var(--line);margin-bottom:2px}

  .today-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .today-progress{font-size:11px;color:var(--ink-2);font-family:"Geist Mono",monospace;background:transparent;border:1px solid var(--line-2);padding:5px 12px;border-radius:999px;letter-spacing:0.05em}
  /* Appears only while several cards hold unsaved input, so it never sits there inert. */
  .submit-all-bar{display:flex;justify-content:flex-end;margin-bottom:-4px}
  .submit-all{display:inline-flex;align-items:center;gap:9px;transition:background .3s var(--ease),transform .3s var(--ease)}
  .submit-all:hover{background:#f0613b;transform:translateY(-1px)}
  .sa-count{font-family:"Geist Mono",monospace;background:rgba(255,255,255,.22);border-radius:999px;padding:1px 7px;font-size:10px;letter-spacing:0}
  .day-groups{display:flex;flex-direction:column;gap:28px}
  .day-group .section-label{margin-bottom:12px}

  /* Master strips — flat, read-only master readings atop the Jour view */
  .master-strips{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
  .master-strip{display:flex;align-items:center;gap:16px;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:12px 20px;transition:border-color .5s var(--ease)}
  .master-strip:hover{border-color:var(--line-2)}
  /* Fixed so every strip's meter starts on the same line; widened to keep the name
     readable now that a partial index also shows its coverage badge. */
  .ms-head{display:flex;align-items:center;gap:9px;min-width:0;flex-shrink:0;width:250px}
  .ms-head .master-mark{width:9px;height:9px}
  .ms-name{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ms-meter{flex:1;height:6px;border-radius:999px;background:var(--bg-3);overflow:hidden;min-width:40px}
  .ms-fill{height:100%;border-radius:999px;transition:width .6s var(--ease)}
  .ms-val{flex-shrink:0;font-family:"Geist Mono",monospace;font-size:20px;font-weight:500;font-feature-settings:"tnum";min-width:56px;text-align:right}
  .ms-val .ms-unit{font-size:11px;color:var(--ink-3);margin-left:1px}
  @media (max-width:640px){
    .ms-head{width:auto;flex:1}
    .master-strip{gap:12px;padding:12px 16px}
    .ms-meter{display:none}
  }
  /* 260px, not 230: the header row can now hold up to four round buttons plus the
     primary action — the widest realistic case (a non-daily, jokerable tracker with
     entries already logged) needs the extra room to keep the tracker's name legible. */
  .today-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .today-card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:14px;transition:border-color .5s var(--ease),transform .5s var(--ease),box-shadow .5s var(--ease)}
  .today-card:hover{border-color:var(--line-2);transform:translateY(-2px)}
  .today-card.done{border-color:var(--accent);background:var(--accent-soft)}
  .today-card.flash{box-shadow:0 0 0 1px var(--accent),0 0 30px -6px rgba(226,84,47,.5)}
  .tc-head{display:flex;align-items:center;justify-content:space-between;gap:6px}
  /* The name carries the tracker's colour directly, in weight — no separate dot repeating
     the same information. */
  .tc-name{font-size:14px;font-weight:600;min-width:0;flex:1;letter-spacing:-0.005em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tc-badge{font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-3);border:1px solid var(--line-2);flex-shrink:0;white-space:nowrap}
  .tc-badge.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  /* flex-basis 0 so a compact field (number, duration) stays on its own line at full width —
     flexbox breaks lines on natural size, before any shrinking, so basis auto would wrap.
     min-content keeps it from being squeezed under its own controls. */
  .tc-input{min-height:34px;display:flex;align-items:center;flex:1 1 0;min-width:min-content}
  /* Controls that lay out in several rows (scale, choices, textarea) claim the full width. */
  .tc-input.wide{flex-basis:auto}
  /* A range input reports a ~159px min-content width; the slider is meant to be squeezable. */
  .tc-input.squeeze{min-width:0}
  .tc-input input,.tc-input textarea{font-size:14px}
  .tc-input input{min-width:0}
  .tc-input textarea{resize:none;line-height:1.4;width:100%}
  /* Every button on the header row shares one height — that shared height, not each
     button's own size, is what makes the row read as one unit. Left to right: joker ·
     entrées précédentes · effacer · paramètres · noter — the geste principal (noter/ajouter)
     always lands rightmost; the joker, a rarer and more deliberate choice, always leftmost. */
  .tc-actions{display:flex;align-items:center;gap:5px;flex-shrink:0}
  .tc-act{height:26px;min-width:26px;padding:0 4px;border-radius:999px;border:1px solid var(--line-2);
    background:none;color:var(--ink-3);cursor:pointer;flex-shrink:0;
    display:inline-flex;align-items:center;justify-content:center;
    font-family:"Geist Mono",monospace;font-size:11px;font-feature-settings:"tnum";
    transition:color .3s var(--ease),border-color .3s var(--ease),background .3s var(--ease),opacity .3s var(--ease)}
  .tc-act:hover{color:var(--ink-2);border-color:var(--ink-2)}
  .tc-act.icon{width:26px;padding:0}
  .tc-act.count{padding:0 7px}
  .tc-act.count.open{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .tc-act.danger:hover{color:var(--warn);border-color:var(--warn)}
  /* Joker: marks the whole day as excluded from calculations (not a zero) — quiet at rest,
     since it's an option, not an alert; accented once on, same convention as every other
     "on" toggle in the app. */
  .tc-act.joker{opacity:.55}
  .tc-act.joker:hover{opacity:1}
  .tc-act.joker.on{opacity:1;color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .tc-act.primary{background:var(--accent);border-color:var(--accent);color:#fff;padding:0 10px;
    font-family:"Geist",ui-sans-serif,sans-serif;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em}
  .tc-act.primary:hover{background:#f0613b;border-color:#f0613b}
  .tc-act.primary:disabled{opacity:0.3;cursor:not-allowed}
  /* A jokered day replaces the entry composer with this line instead — the dash is the
     same glyph the app already uses everywhere for "nothing here", so a joker day reads
     as a day without a value, not as a zero or a mistake. */
  .tc-dash-row{display:flex;align-items:baseline;gap:11px;min-height:34px}
  .tc-dash{font-size:22px;color:var(--ink-3);line-height:1}
  .tc-dash-msg{font-size:14px;color:var(--ink-3)}
  /* Boxed, labelled, collapsed by default — expands under the input row when the badge is clicked.
     The negative margin cancels the parent's 14px flex gap so a collapsed list leaves no empty space. */
  .tc-log{display:flex;flex-direction:column;overflow:hidden;max-height:0;opacity:0;margin-top:-14px;
    border:1px solid transparent;border-radius:var(--radius);
    transition:max-height .4s var(--ease),opacity .3s var(--ease),border-color .3s var(--ease),padding .4s var(--ease),margin-top .4s var(--ease)}
  .tc-log.open{max-height:min(60vh,420px);opacity:1;margin-top:0;overflow-y:auto;border-color:var(--line);padding:4px 10px}
  .tc-log-label{font-size:9px;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-3);padding:8px 2px 2px}
  /* Time on the left, actions pushed right up against the value, value last on the right edge. */
  .tc-log-row{display:flex;align-items:baseline;gap:8px;padding:8px 2px;border-top:1px solid var(--line)}
  .tc-log-row:first-of-type{border-top:none}
  .tc-log-row .t{font-family:"Geist Mono",monospace;font-size:10.5px;color:var(--ink-3);letter-spacing:0.03em;font-feature-settings:"tnum";flex-shrink:0}
  .tc-log-row .v{font-family:"Geist Mono",monospace;font-size:13px;font-weight:500;text-align:right;font-feature-settings:"tnum";flex-shrink:0}
  .tc-log-row .v .u{color:var(--ink-3);font-weight:400;font-size:11px;margin-left:2px}
  .tc-log-actions{display:flex;gap:2px;margin-left:auto;min-width:0;opacity:0;transition:opacity .3s var(--ease)}
  .tc-log-row:hover .tc-log-actions{opacity:1}
  .tc-log-actions button{font-size:9px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-3);padding:3px 7px;border-radius:999px;transition:color .3s,background .3s}
  .tc-log-actions button:hover{color:var(--ink);background:var(--bg-3)}
  .tc-log-actions button.del:hover{color:var(--warn)}
  @media (hover:none){ .tc-log-actions{opacity:1} }

  /* Chrono — stopwatch cards. A running one is ringed in accent so the board reads
     at a glance: what is counting right now, and what is only banked. */
  .chrono-empty{padding:70px 20px;text-align:center}
  .chrono-empty .em-serif{font-family:"Instrument Serif",serif;font-style:italic;font-size:30px;color:var(--ink-2)}
  .chrono-empty-sub{font-size:13px;color:var(--ink-3);line-height:1.6;max-width:44ch;margin:0 auto 26px}
  .chrono-add-big{transition:background .35s var(--ease),transform .35s var(--ease)}
  .chrono-add-big:hover{background:#f0613b;transform:translateY(-1px)}
  .chrono-add{margin-top:16px;padding:12px 20px;border-radius:999px;border:1px dashed var(--line-2);color:var(--ink-3);font-size:10px;text-transform:uppercase;letter-spacing:0.12em;transition:color .35s var(--ease),border-color .35s var(--ease)}
  .chrono-add:hover{color:var(--accent);border-color:var(--accent)}
  .chrono-card.running{border-color:var(--accent);background:var(--accent-soft)}
  .chrono-link{overflow:hidden;text-overflow:ellipsis;max-width:45%}
  .chrono-time{font-family:"Geist Mono",monospace;font-feature-settings:"tnum";font-size:32px;font-weight:500;letter-spacing:0.01em;color:var(--ink-2);transition:color .4s var(--ease)}
  .chrono-time.running{color:var(--ink)}
  .chrono-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .chrono-secondary{display:flex;gap:4px;align-items:center;margin-left:auto}
  .chrono-btn{font-size:10px;text-transform:uppercase;letter-spacing:0.1em;padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);transition:color .3s,border-color .3s,background .3s}
  .chrono-btn:hover{color:var(--ink);border-color:var(--ink-2)}
  .chrono-btn.start{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .chrono-btn.start:hover{background:#fff;border-color:#fff}
  .chrono-btn.pause{border-color:var(--accent);color:var(--accent)}
  .chrono-btn.pause:hover{background:var(--accent);color:#fff}
  .chrono-btn.ghost,.chrono-btn.del{border-color:transparent;color:var(--ink-3);padding:8px 9px;letter-spacing:0.06em}
  .chrono-btn.ghost:hover{color:var(--ink);background:var(--bg-3)}
  .chrono-btn.del:hover{color:var(--warn);background:var(--bg-3)}
  .chrono-save{width:100%;justify-content:center}
  .chrono-bar{display:flex;gap:6px;align-items:center;margin-bottom:16px}
  .chrono-detached{padding:50px 20px;text-align:center;color:var(--ink-3)}
  .chrono-detached .em-serif{font-family:"Instrument Serif",serif;font-style:italic;font-size:22px;color:var(--ink-2)}

  /* Floating picture-in-picture window: no page chrome, so the cards fill it edge to
     edge in a single column, and the clock stays the biggest thing in a small pane. */
  body.pip-body{padding:10px;background:var(--bg);overflow-x:hidden}
  body.pip-body::before{display:none}
  body.pip-body .today-grid{grid-template-columns:1fr;gap:8px}
  body.pip-body .today-card{padding:12px;animation:none}
  body.pip-body .chrono-time{font-size:26px}
  body.pip-body .chrono-btn{padding:7px 11px}

  /* One line, always: the sub-tabs and the add button never stack. nowrap is the
     rule, and what gives when the room runs out is the button's label (see the
     breakpoints below), then the gap — never a second row. */
  .log-subnav{display:flex;align-items:center;gap:22px;margin-bottom:26px;flex-wrap:nowrap}
  .log-subhint{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.08em;
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Sized to match the Jour/Historique/Chrono pill group exactly, never taller
     than that one line; the label shrinks in two steps before anything wraps. */
  .subnav-add{white-space:nowrap;flex:0 0 auto;padding:6px 14px;font-size:11px;text-transform:uppercase;letter-spacing:0.08em}
  .subnav-add .add-mid,.subnav-add .add-min{display:none}
  @media (max-width:620px){
    .log-subnav{gap:12px}
    .subnav-add .add-full{display:none} .subnav-add .add-mid{display:inline}
  }
  @media (max-width:440px){
    .log-subnav{gap:8px}
    .subnav-add{padding:6px 11px}
    .subnav-add .add-mid{display:none} .subnav-add .add-min{display:inline}
  }
  /* Last resort on the narrowest phones: tighten the sub-tabs themselves rather
     than let the row overflow the screen. */
  @media (max-width:390px){
    .log-subnav .seg-track.compact button{padding:6px 9px;letter-spacing:0.05em}
  }

  .trackers-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
  .trackers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .tk-card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;transition:border-color .5s var(--ease),transform .5s var(--ease)}
  .tk-card:hover{border-color:var(--line-2);transform:translateY(-2px)}
  .tk-info{min-width:0;flex:1;display:flex;flex-direction:column;gap:10px}
  .tk-name{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:500;min-width:0}
  .tk-name>span:not(.dot){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tk-name .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .tk-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .tk-type{font-size:9px;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-2);background:transparent;border:1px solid var(--line-2)}
  .tk-chip{font-size:10px;color:var(--ink-3);border:1px solid var(--line);text-transform:uppercase;letter-spacing:0.06em}
  .tk-count{font-size:11px;color:var(--ink-3);font-family:"Geist Mono",monospace}
  .tk-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  .tk-edit,.de-today{font-size:10px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:999px;padding:8px 14px;background:transparent;text-transform:uppercase;letter-spacing:0.12em;transition:all .35s var(--ease)}
  .tk-edit{flex-shrink:0}
  .tk-edit:hover,.de-today:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .tk-arch{font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:transparent;text-transform:uppercase;letter-spacing:0.12em;transition:all .35s var(--ease)}
  .tk-arch:hover{border-color:var(--ink-2);color:var(--ink)}
  .tk-card.archived{opacity:0.6}
  .tk-card.archived:hover{opacity:1}
  /* Master marker (diamond) */
  .master-mark{width:10px;height:10px;flex-shrink:0;transform:rotate(45deg);border-radius:2px}
  .master-tag{font-size:9px;text-transform:uppercase;letter-spacing:0.12em;color:var(--accent);border:1px solid var(--accent);margin-left:8px;flex-shrink:0;white-space:nowrap}

  /* ------------------------------------------------------------------
     Un nom long se coupe — il n'élargit jamais sa carte.
     Un tracker peut porter n'importe quel nom, et sans ces règles c'est
     la carte (ou la pastille, ou la ligne) qui s'étire pour le contenir,
     jusqu'à dépasser l'écran et faire défiler toute la page en travers.
     La règle est la même partout : le conteneur du nom accepte de
     rétrécir (min-width:0, sinon un élément flex refuse de passer sous
     sa taille de contenu), le nom se coupe en « … », et ce qui
     l'accompagne — badges, valeurs, boutons — ne rétrécit pas.
     ------------------------------------------------------------------ */
  /* La pièce maîtresse : une case de grille vaut par défaut `min-width:auto`,
     c'est-à-dire « au moins la largeur de mon contenu ». Une carte au nom long
     imposait donc sa largeur à sa colonne — 692 px dans 354 px d'écran — et
     `overflow-x:hidden` sur <html> masquait le débordement au lieu de le
     signaler : la carte était juste coupée, hors d'atteinte. Rendre les cases
     réductibles est ce qui laisse la troncature ci-dessous entrer en jeu. */
  .today-grid>*,.trackers-grid>*,.gridview>*,.chart-grid-layout>*{min-width:0}
  .ms-name{min-width:0}
  .lg-item{min-width:0}
  .lg-name{min-width:0;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .entry .name{min-width:0}
  .entry .name>span:not(.dot){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Pastilles du rail et sélecteur de membres : bornées, jamais plus larges
     que leur ligne, quel que soit le nom. */
  .pill{max-width:100%}
  .pill>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail .pill{max-width:min(100%,264px)}
  .member{max-width:min(100%,240px)}
  .member>span:not(.dot):not(.master-mark){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Coverage hint: an index built on some of its members, not all of them. */
  .ms-partial{font-size:9px;font-family:"Geist Mono",monospace;color:var(--ink-3);border:1px solid var(--line-2);margin-left:6px;white-space:nowrap}
  .chart-head .name .master-mark{margin-right:2px}

  /* History calendar + day editor */
  .cal{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:30px;max-width:440px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .cal-title{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;font-size:20px;text-transform:capitalize;letter-spacing:0}
  .cal-nav{font-size:17px;line-height:1;color:var(--ink-2);transition:all .35s var(--ease)}
  .cal-nav:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-dow{text-align:center;font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-3);padding-bottom:4px}
  .cal-cell{position:relative;aspect-ratio:1;border-radius:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink-2);border:1px solid transparent;font-feature-settings:"tnum";font-family:"Geist Mono",monospace;transition:background .3s var(--ease),color .3s var(--ease)}
  .cal-cell.blank{pointer-events:none}
  .cal-cell:not(.blank):hover{background:var(--bg-3);color:var(--ink)}
  .cal-cell.today{border-color:var(--line-2);color:var(--ink);font-weight:600}
  .cal-cell.sel{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .cal-dot{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent)}
  .cal-cell.sel .cal-dot{background:#fff}

  .day-editor-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .de-title{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;font-size:28px;color:var(--ink);text-transform:capitalize;line-height:1;letter-spacing:0}
  .de-sub{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.08em;font-family:"Geist Mono",monospace}
  /* Week number, next to a day's title — plain metadata, not a status, so it stays
     neutral rather than borrowing the accent the way a master's tag does. */
  .week-tag{display:inline-flex;align-items:center;vertical-align:middle;margin-left:10px;
    font-size:11px;font-style:normal;text-transform:none;letter-spacing:0.02em;
    color:var(--ink-3);border:1px solid var(--line-2);border-radius:999px;padding:2px 9px}
  .de-today{margin-left:auto}
  .day-entries{margin-top:4px}

  /* ============================================================
     Food — page nutrition (app.food.jsx). Mêmes jetons de couleur
     que le reste, donc le mode clair suit sans une règle de plus.
     ============================================================ */
  .fd-datebar{display:flex;align-items:center;gap:14px;margin-bottom:20px}
  .fd-date{display:flex;flex-direction:column;gap:2px;min-width:0}
  .fd-date-main{font-family:"Instrument Serif",serif;font-style:italic;font-size:26px;color:var(--ink);text-transform:capitalize;line-height:1}
  .fd-date-sub{font-size:10px;color:var(--ink-3);letter-spacing:0.08em}
  .cal-nav:disabled{opacity:.3}

  /* Calories sur toute la largeur, les trois macros se partageant la ligne d'après. */
  .fd-totals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .fd-total{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:8px;transition:border-color .5s var(--ease)}
  .fd-total:hover{border-color:var(--line-2)}
  .fd-total.lead{grid-column:1 / -1}
  .fd-total-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:24px}
  .fd-total-label{font-size:10px;text-transform:uppercase;letter-spacing:0.14em;color:var(--ink-3)}
  .fd-total-v{font-family:"Geist Mono",monospace;font-size:22px;color:var(--ink);line-height:1;display:flex;align-items:baseline;gap:4px}
  .fd-total.lead .fd-total-v{font-size:28px}
  .fd-total-v .u{font-size:10px;color:var(--ink-3)}
  .fd-total-goal{font-size:10px;color:var(--ink-3);letter-spacing:0.06em}
  .fd-meter{display:block;height:3px;background:var(--bg-3);border-radius:2px;overflow:hidden}
  .fd-fill{display:block;height:100%;border-radius:2px;transition:width .6s var(--ease)}
  .fd-fill.over{background:var(--warn)!important}

  .fd-note{font-size:12px;color:var(--ink-2);margin:0 0 16px;line-height:1.6}
  .fd-note.warn{color:var(--warn)}
  .fd-link{background:none;border:none;padding:0;color:var(--accent);font-size:12px;text-decoration:underline;text-underline-offset:3px}
  .fd-link:hover{color:var(--ink)}

  .fd-scan-cta{margin-bottom:22px}
  .fd-primary{display:inline-flex;align-items:center;gap:9px;border:none;transition:all .35s var(--ease)}
  .fd-primary:hover{background:var(--accent-2)}

  .fd-meal{margin-bottom:20px}
  .fd-meal-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
  .fd-meal-kcal{font-size:11px;color:var(--ink-3)}
  .fd-row{display:flex;align-items:baseline;gap:14px;padding:11px 2px;border-top:1px solid var(--line)}
  .fd-row-main{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .fd-row-name{font-size:13px;color:var(--ink)}
  .fd-row-brand{font-size:11px;color:var(--ink-3)}
  .fd-row-qty{font-size:11px;color:var(--ink-2)}
  .fd-row-macros{display:flex;gap:10px;font-size:11px;color:var(--ink-3);flex-shrink:0}
  .fd-row-macros i{font-style:normal;opacity:.6;margin-left:2px}
  .fd-row-kcal{font-family:"Geist Mono",monospace;font-size:13px;color:var(--ink);flex-shrink:0}
  .fd-row-kcal i{font-style:normal;font-size:9px;color:var(--ink-3);margin-left:3px}
  .fd-row-actions{display:flex;gap:8px;opacity:0;transition:opacity .35s var(--ease);flex-shrink:0}
  .fd-row:hover .fd-row-actions{opacity:1}
  .fd-row-actions button{font-size:10px;color:var(--ink-3);background:none;border:none;padding:4px 6px;text-transform:uppercase;letter-spacing:0.08em}
  .fd-row-actions button:hover{color:var(--ink)}
  .fd-row-actions button.del:hover{color:var(--warn)}
  .fd-add{margin-top:8px;font-size:11px;color:var(--ink-3);background:none;border:1px dashed var(--line-2);border-radius:999px;padding:7px 14px;transition:all .35s var(--ease)}
  .fd-add:hover{color:var(--ink);border-color:var(--ink-3)}

  .fd-micros-block{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
  .fd-micros{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 22px;margin-top:14px}
  .fd-micro{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .fd-micro-label{font-size:12px;color:var(--ink-2)}
  .fd-micro-v{font-size:12px;color:var(--ink)}
  .fd-micro-rda{font-style:normal;font-size:10px;color:var(--ink-3);margin-left:6px}

  /* Scanner */
  .fd-scan-view{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/3;border:1px solid var(--line-2)}
  .fd-scan-view video{width:100%;height:100%;object-fit:cover;display:block}
  .fd-reticle{position:absolute;inset:16% 10%;pointer-events:none}
  .fd-reticle span{position:absolute;width:26px;height:26px;border:2px solid rgba(255,255,255,.85)}
  .fd-reticle span:nth-child(1){top:0;left:0;border-right:none;border-bottom:none}
  .fd-reticle span:nth-child(2){top:0;right:0;border-left:none;border-bottom:none}
  .fd-reticle span:nth-child(3){bottom:0;left:0;border-right:none;border-top:none}
  .fd-reticle span:nth-child(4){bottom:0;right:0;border-left:none;border-top:none}
  .fd-scan-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:12px;line-height:1.6;color:#efe9dd;background:rgba(0,0,0,.72)}
  .fd-scan-overlay.err{color:#ffb4a0}
  .fd-torch{position:absolute;left:10px;bottom:10px;font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 12px}
  .fd-torch.on{background:var(--accent);border-color:var(--accent)}
  /* Interrupteur caméra — en bas à droite du cadre, visible allumé comme éteint */
  /* Éteinte, la balise vidéo vide resterait un rectangle noir devant le fond */
  .fd-scan-view.off{background:var(--bg-3)}
  .fd-scan-view.off video{display:none}
  .fd-cam-toggle{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;
    font-size:10px;text-transform:uppercase;letter-spacing:0.1em;cursor:pointer;
    color:#fff;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:6px 12px;
    transition:background .3s var(--ease),border-color .3s var(--ease)}
  .fd-cam-toggle.on{background:var(--accent);border-color:var(--accent)}
  .fd-scan-view.off .fd-cam-toggle{color:var(--ink);background:var(--bg-2);border-color:var(--line-2)}
  .fd-scan-view.off .fd-cam-toggle:hover{border-color:var(--accent);color:var(--accent)}

  /* Deux rangées d'onglets dans la modale d'ajout : trouver / ce qui est à soi */
  .fd-tabs{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}

  /* Étoile favori */
  .fd-fav{display:flex;align-items:center;padding:0 8px;color:var(--ink-3);flex-shrink:0;cursor:pointer;
    background:none;border:none;transition:color .3s var(--ease)}
  .fd-fav:hover{color:var(--ink-2)}
  .fd-fav.on{color:var(--accent)}
  .fd-fav-btn.on{color:var(--accent);border-color:var(--accent)}

  /* Éditeur d'ingrédients — partagé par l'analyse IA et les repas enregistrés */
  .fd-ing-editor{margin:10px 0}
  .fd-ing{border-bottom:1px solid var(--line);padding:9px 0}
  .fd-ing.open{background:var(--bg-3);border-radius:var(--radius);padding:9px 10px;margin:0 -10px}
  .fd-ing-main{display:flex;align-items:center;gap:8px}
  .fd-ing-name{flex:1;min-width:0;font-size:13px;padding:5px 0;border:none;border-bottom:1px solid transparent;background:none}
  .fd-ing-name:focus{border-bottom-color:var(--line-2);outline:none}
  .fd-ing-qty{display:inline-flex;align-items:baseline;gap:2px;flex-shrink:0}
  .fd-ing-qty input{width:58px;text-align:right;font-family:"Geist Mono",monospace;font-size:13px;padding:5px 4px}
  .fd-ing-qty>i{font-size:10px;color:var(--ink-3);font-style:normal}
  .fd-ing-kcal{flex-shrink:0;font-size:13px;color:var(--ink);min-width:62px;text-align:right}
  .fd-ing-kcal>i{font-size:9px;color:var(--ink-3);font-style:normal;margin-left:2px}
  .fd-ing-btn{font-size:11px;line-height:1}
  .fd-ing-btn:hover{color:var(--ink);border-color:var(--ink-2)}
  .fd-ing-btn.del:hover{color:var(--warn);border-color:var(--warn)}
  .fd-ing-macros{display:flex;gap:14px;align-items:baseline;font-size:11px;color:var(--ink-3);margin-top:3px}
  .fd-ing-macros>span>i{font-size:9px;margin-left:2px;font-style:normal;opacity:.7}
  .fd-ing-note{font-style:italic;font-size:11px;color:var(--ink-3);margin-left:auto;text-align:right;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
  .fd-ing-edit{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .fd-ing-picker{margin-top:12px}
  .fd-ing-total{display:flex;gap:16px;align-items:baseline;margin-top:12px;padding-top:10px;
    border-top:1px solid var(--line-2);font-size:13px}
  .fd-ing-total-l{flex:1;font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-3)}
  .fd-ing-total>span>i{font-size:9px;color:var(--ink-3);font-style:normal;margin-left:2px}

  /* Analyse IA */
  .fd-ai-input textarea{width:100%;resize:vertical;min-height:70px}
  .fd-ai-actions{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-top:8px}
  .fd-ai-hint{font-size:12px;color:var(--ink-3);flex:1}
  .fd-ai-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:16px 0 4px}
  .fd-ai-plat{font-size:18px}
  .fd-ai-marge{font-size:11px;color:var(--ink-3);text-align:right}

  /* Recette d'un repas — une simple liste d'étapes numérotées */
  .fd-steps{display:flex;flex-direction:column;gap:8px}
  .fd-step{display:flex;align-items:center;gap:8px}
  .fd-step-n{flex-shrink:0;width:20px;font-size:11px;color:var(--ink-3);text-align:right}
  .fd-step input{flex:1}
  .fd-scan-hint{font-size:12px;color:var(--ink-3);margin:10px 0 0;line-height:1.6}
  .fd-manual{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
  .fd-manual label{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.12em}
  .fd-manual input{flex:1;min-width:120px}

  /* Recherche et listes de résultats */
  .fd-search-bar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
  .fd-search-bar input{flex:1}
  .fd-list{max-height:46vh;overflow-y:auto;margin:0 -4px}
  .fd-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 4px;border:none;border-bottom:1px solid var(--line);background:none;transition:background .3s var(--ease)}
  .fd-item:hover{background:var(--bg-3)}
  .fd-item img{width:38px;height:38px;object-fit:cover;border-radius:2px;flex-shrink:0;background:var(--bg-3)}
  .fd-item-ph{width:38px;height:38px;border-radius:2px;flex-shrink:0;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-family:"Instrument Serif",serif;font-style:italic;color:var(--ink-3)}
  .fd-item-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
  .fd-item-txt .n{font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fd-item-txt .m{font-size:10px;color:var(--ink-3)}
  .fd-item{border-bottom:none;flex:1;min-width:0}
  .fd-item-row{display:flex;align-items:stretch;gap:2px;border-bottom:1px solid var(--line)}
  .fd-item-row:hover{background:var(--bg-3)}
  .fd-item-txt .b{font-size:10px;color:var(--ink-2);text-transform:uppercase;letter-spacing:0.1em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fd-item-txt .m b{color:var(--ink-2);font-weight:500}
  .fd-item-src{display:flex;align-items:center;padding:0 10px;color:var(--ink-3);font-size:13px;text-decoration:none;flex-shrink:0;transition:color .3s var(--ease)}
  .fd-item-src:hover{color:var(--accent)}
  .fd-list-label{font-size:10px;text-transform:uppercase;letter-spacing:0.14em;color:var(--ink-3);margin:10px 0 2px;padding:0 4px}
  .fd-search-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px 0 6px;min-height:18px}
  .fd-search-meta .serif{font-size:12px;color:var(--ink-3)}
  .fd-thumb-toggle{font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-3);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;flex-shrink:0;transition:color .3s var(--ease),border-color .3s var(--ease)}
  .fd-thumb-toggle:hover,.fd-thumb-toggle.on{color:var(--accent);border-color:var(--accent)}
  .fd-src-line{margin-top:12px}
  .fd-src-line a,.fd-src-link{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line-2);transition:color .3s var(--ease)}
  .fd-src-line a:hover,.fd-src-link:hover{color:var(--accent);border-color:var(--accent)}
  a.tk-edit.fd-src-link{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:10px;text-transform:uppercase;letter-spacing:0.1em;display:inline-block}

  /* Le bloc Sources, en bas de la page Food */
  .fd-sources{margin:44px 0 8px;padding-top:20px;border-top:1px solid var(--line);max-width:62ch}
  .fd-sources p.serif{font-size:12px;line-height:1.7;color:var(--ink-3);margin:0 0 12px}
  .fd-sources a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line-2)}
  .fd-sources a:hover{color:var(--accent);border-color:var(--accent)}
  .fd-source-links{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:10px;text-transform:uppercase;letter-spacing:0.1em}
  .fd-source-links a{border-bottom:none;color:var(--ink-3)}

  /* Scanner : zoom, photo de secours, diagnostic */
  .fd-zoom{display:flex;align-items:center;gap:12px;margin-top:12px}
  .fd-zoom label{font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-3)}
  .fd-zoom input[type=range]{flex:1;accent-color:var(--accent)}
  .fd-scan-diag{color:var(--ink-3);opacity:.65;font-size:10px;white-space:nowrap}
  .fd-scan-alt{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
  .fd-photo{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-2);border:1px solid var(--line-2);border-radius:999px;padding:8px 16px;cursor:pointer;transition:color .3s var(--ease),border-color .3s var(--ease)}
  .fd-photo:hover{color:var(--accent);border-color:var(--accent)}
  .fd-photo.busy{opacity:.6}
  .fd-photo input{display:none}
  .fd-scan-alt-note{font-size:12px;color:var(--ink-3)}

  /* Saisie à la main */
  .fd-manual-entry .field{border-bottom:1px solid var(--line)}
  .fd-qty-inline{display:flex;align-items:center;gap:10px;flex:1;flex-wrap:wrap}
  .fd-qty-inline input{width:84px;font-family:"Geist Mono",monospace;text-align:right}
  .fd-mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
  .fd-mini-field{display:flex;flex-direction:column;gap:5px}
  .fd-mini-field>span{font-size:9px;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-3)}
  .fd-mini-field input{width:100%;font-family:"Geist Mono",monospace;font-size:17px;text-align:center;padding:8px 4px}
  .fd-mini-field>i{font-size:9px;color:var(--ink-3);text-align:center;font-style:normal;letter-spacing:0.08em}
  .fd-keep{display:flex;align-items:flex-start;gap:10px;margin:14px 0 2px;font-size:12px;color:var(--ink-2);cursor:pointer}
  .fd-keep input{accent-color:var(--accent);margin-top:1px}
  .fd-keep.off{color:var(--ink-3);cursor:default}
  .fd-keep i{font-style:italic;font-family:"Instrument Serif",serif;color:var(--ink-3)}

  /* Quantité */
  .fd-qty{display:flex;align-items:center;gap:12px;margin:6px 0 12px;flex-wrap:wrap}
  .fd-qty input{width:96px;font-size:20px;font-family:"Geist Mono",monospace;text-align:right}
  .fd-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .fd-chips button{font-size:11px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:transparent;transition:all .35s var(--ease)}
  .fd-chips button:hover{border-color:var(--line-2);color:var(--ink)}
  .fd-preview{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:6px}
  .fd-preview>div{display:flex;flex-direction:column;gap:5px;text-align:center}
  .fd-preview .l{font-size:9px;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-3)}
  .fd-preview .v{font-family:"Geist Mono",monospace;font-size:17px;color:var(--ink)}
  .fd-modal .modal-section{margin-top:18px}
  .fd-more-fields{margin-top:6px}

  /* Bibliothèque */
  .fd-lib-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .fd-lib-search{max-width:180px}
  .fd-food-card{flex-direction:column;align-items:stretch}
  .fd-food-nums{font-size:11px;color:var(--ink-2);margin-top:8px}
  .fd-per{color:var(--ink-3)}
  /* Les actions d'un aliment tiennent sur une ligne (elles passent à la suivante
     si la carte est vraiment étroite), et la source se réduit à sa flèche. */
  /* Colonnes plus larges que la grille de trackers : une carte d'aliment porte
     quatre actions sur une ligne, il lui faut la place de les tenir. */
  .fd-foods-grid{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
  .fd-food-actions{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}
  .fd-food-actions .tk-edit{padding:7px 10px;letter-spacing:0.08em}
