<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<script>
  // Set before the stylesheet is parsed, so the chosen theme never flashes the
  // wrong colours on load. A device preference, not account data — read here
  // without waiting on Supabase auth to resolve.
  // THEME_IDS doubles the list held in app.jsx (THEMES) on purpose: this runs
  // before any script loads, so it cannot read it. Adding a theme means adding
  // its id here too — and a stored value outside the list falls back to dark
  // rather than leaving the page with no tokens at all.
  var THEME_IDS = ['dark', 'light', 'matrix', 'paper', 'paper-dark'];
  try{
    var t = localStorage.getItem('tracklog.theme');
    if (THEME_IDS.indexOf(t) !== -1) document.documentElement.dataset.theme = t;
  } catch(e){}
  // La couleur d'accent choisie, posée avant le premier pixel pour la même
  // raison que le thème. Les deux dérivées (survol, fond très pâle) se
  // calculent en CSS : une seule couleur est stockée, jamais trois qui
  // pourraient diverger. `applyAccent` est réutilisée par l'app (THEMES,
  // app.jsx) quand on change de couleur en cours de route.
  window.applyAccent = function(c){
    var r = document.documentElement.style;
    if (!c){ r.removeProperty('--primary'); r.removeProperty('--primary-hover'); r.removeProperty('--primary-soft'); return; }
    r.setProperty('--primary', c);
    r.setProperty('--primary-hover', 'color-mix(in oklab, ' + c + ' 84%, #000)');
    r.setProperty('--primary-soft', 'color-mix(in srgb, ' + c + ' 14%, transparent)');
  };
  try{ window.applyAccent(localStorage.getItem('tracklog.accent') || ''); } catch(e){}
</script>

<div id="root"><div class="boot-fallback" id="boot-fallback"><span class="em-serif">Chargement…</span><p id="boot-msg"></p></div></div>

<!-- Boot watchdog: the app depends on React/Babel/Supabase loading live from
     CDNs (see script tags below) and on app.jsx running without throwing.
     If any of that fails — CDN blocked/down, offline, ad-blocker — React
     never mounts and #root would otherwise stay on its initial "Chargement…"
     forever with no clue why. This catches load failures and any uncaught
     error/rejection during boot and swaps in a plain-language message with
     a retry button, so the screen is never just the background gradient. -->
<script>
(function(){
  var done = false; // set true once app.jsx has actually mounted React
  window.__tkBootDone = function(){ done = true; };
  function show(msg){
    if (done) return;
    var el = document.getElementById('boot-msg');
    if (el) el.innerHTML = msg + '<br><button onclick="location.reload()" style="margin-top:14px;background:var(--primary);color:var(--primary-foreground);padding:9px 18px;border-radius:var(--radius-pill);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase">Réessayer</button>';
  }
  window.addEventListener('error', function(e){
    show('Un script n’a pas pu se charger ou a échoué (' + (e.message || (e.target && e.target.src) || 'erreur inconnue') + '). Vérifie ta connexion ou désactive un éventuel bloqueur de scripts, puis réessaie.');
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    show('Une erreur est survenue au chargement (' + (e.reason && e.reason.message || e.reason) + '). Réessaie.');
  });
  setTimeout(function(){
    if (!done) show('Le chargement prend trop de temps — probablement une ressource externe (CDN) inaccessible depuis ce réseau. Vérifie ta connexion, puis réessaie.');
  }, 12000);
})();
</script>

<!-- Desktop custom cursor: a lagging dot + ring that grows over interactive
     elements. Lives on <body> outside React's #root and only uses global
     listeners, so React re-renders never disturb it. Disabled on touch /
     coarse-pointer devices (phones), where the native experience is kept. -->
<script>
(function(){
  if(!window.matchMedia || !matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  var dot=document.createElement('div'); dot.className='cursor-dot';
  var ring=document.createElement('div'); ring.className='cursor-ring';
  document.body.appendChild(dot); document.body.appendChild(ring);
  document.documentElement.classList.add('has-cursor');
  /* Le rond suit le pointeur EXACTEMENT. Il glissait avant derrière lui (une
     interpolation par image : le point à 40 %, l'anneau à 16 %), effet joli sur
     une page qu'on regarde, gênant sur une app qu'on utilise — on vise un
     bouton et la marque arrive après le doigt. La position est donc posée
     telle quelle, dans une image d'animation pour n'écrire qu'une fois par
     rafraîchissement même si la souris envoie dix événements entre deux. */
  var mx=innerWidth/2, my=innerHeight/2, queued=false;
  var place=function(){
    queued=false;
    var t='translate('+mx+'px,'+my+'px)';
    dot.style.transform=t; ring.style.transform=t;
  };
  place();
  addEventListener('mousemove',function(e){
    mx=e.clientX; my=e.clientY;
    if(!queued){ queued=true; requestAnimationFrame(place); }
  },{passive:true});
  var hot='a,button,input,textarea,select,.pill,.cal-cell:not(.blank),.gv-card,.today-card,.swatch';
  var root=document.documentElement;
  document.addEventListener('mouseover',function(e){ if(e.target.closest && e.target.closest(hot)) root.classList.add('cursor-hot'); });
  document.addEventListener('mouseout',function(e){ if(e.target.closest && e.target.closest(hot)) root.classList.remove('cursor-hot'); });
  addEventListener('mousedown',function(){ root.classList.add('cursor-down'); });
  addEventListener('mouseup',function(){ root.classList.remove('cursor-down'); });
})();
</script>

<!-- Six fichiers, un seul montage. Babel exécute les scripts dans l'ordre où ils
     sont écrits ici, et cet ordre est celui des dépendances : app.core.jsx pose
     l'espace de noms (React, supabase, le modèle, les registres), app.ui.jsx les
     briques partagées, app.charts.jsx ce qui dessine les données, app.jsx l'app
     et ses écrans, app.food.jsx la page Food, app.atelier.jsx l'atelier
     (#atelier, qui rend les composants des autres et relit leurs sources), et
     le dernier script monte React une fois les six en place. Réordonner, c'est
     casser. -->
<script type="text/babel" src="app.core.jsx?v=2"></script>
<script type="text/babel" src="app.ui.jsx?v=2"></script>
<script type="text/babel" src="app.charts.jsx?v=2"></script>
<script type="text/babel" src="app.jsx?v=71"></script>
<script type="text/babel" src="app.food.jsx?v=39"></script>
<script type="text/babel" src="app.atelier.jsx?v=1"></script>
<script type="text/babel">mountTracklog();</script>
